<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナレッジ・FAQ — 第1ライン FY2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
.search-wrap{position:relative;margin-bottom:1.25rem}
.search-input{width:100%;padding:.65rem 1rem .65rem 2.5rem;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.filter-btn{font-size:12px;font-weight:500;padding:4px 12px;border-radius:999px;cursor:pointer;border:.5px solid var(--border);background:transparent;color:var(--text2);font-family:var(--font);transition:.15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.active{background:var(--blue-dim);border-color:rgba(59,130,246,.4);color:var(--blue)}
.faq-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.faq-card:hover{border-color:var(--border2)}
.faq-header{padding:.9rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.faq-q{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:flex-start;line-height:1.6;flex:1}
.faq-q::before{content:'Q';font-family:var(--mono);font-size:11px;color:var(--blue);background:var(--blue-dim);padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:2px}
.faq-chevron{color:var(--text3);font-size:16px;flex-shrink:0;transition:transform .2s;margin-top:2px}
.faq-card.open .faq-chevron{transform:rotate(90deg)}
.faq-body{display:none;padding:0 1.1rem 1rem}
.faq-card.open .faq-body{display:block}
.faq-a{display:flex;gap:8px;align-items:flex-start}
.faq-a::before{content:'A';font-family:var(--mono);font-size:11px;color:var(--green);background:var(--green-dim);padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:2px}
.faq-a-body{flex:1;min-width:0}
.faq-footer{display:flex;gap:8px;align-items:center;margin-top:.6rem;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 7px;border-radius:3px;background:var(--bg3);color:var(--text3)}
.article-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.article-card:hover{border-color:var(--border2)}
.article-header{padding:.9rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.article-title{font-weight:700;font-size:14px}
.article-summary{font-size:12px;color:var(--text2);margin-top:3px}
.article-chevron{color:var(--text3);font-size:16px;flex-shrink:0;transition:transform .2s}
.article-card.open .article-chevron{transform:rotate(90deg)}
.article-body{display:none;padding:0 1.25rem 1.25rem}
.article-card.open .article-body{display:block}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:13px}
.result-count{font-size:12px;color:var(--text3);margin-bottom:1rem;font-family:var(--mono)}
.child-qa-section{margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1rem}
.child-qa-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.child-faq-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden}
.child-faq-header{padding:.7rem .9rem;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.child-faq-body{display:none;padding:0 .9rem .75rem}
.child-faq-card.open .child-faq-body{display:block}
.child-faq-card.open .faq-chevron{transform:rotate(90deg)}
.child-qa-badge{font-size:10px;background:var(--blue-dim);color:var(--blue);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="loading"><div class="spinner"></div><span>ナレッジを読み込んでいます...</span></div>
<div id="app">
<main class="main">
  <div class="page-header">
    <h1>ナレッジ・FAQ</h1>
    <p>社内ルール・よくある問い合わせ・技術Tips</p>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" type="text" placeholder="キーワードで検索..." autocomplete="off">
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem" id="filters"></div>
  <div class="result-count" id="resultCount"></div>
  <div id="qaSection"><div class="section-label">Q&amp;A</div><div id="qaList"></div></div>
  <div id="articleSection"><div class="section-label">記事・ガイド</div><div id="articleList"></div></div>
</main>
</div>

<script src="nav.js"></script>
<script src="md.js"></script>
<script>
const CAT_PALETTE = ['blue','green','amber','purple','cyan','red'];
let allItems = [], currentCat = 'すべて', currentQuery = '';
let catColorMap = {};
let childrenByParent = new Map();
const esc = window.escapeHTML;

function catColor(cat) { return catColorMap[cat] || 'blue'; }

// 「親ナレッジ」が設定されている = 記事の子Q&A。
// 種別=ナレッジ → 記事・ガイドセクション。種別=FAQ/手順 → Q&Aセクション。
// 子Q&Aを持つアイテムは種別によらず記事・ガイドとして扱う。
function filterItems() {
  const q = currentQuery.toLowerCase();
  const topLevel = allItems.filter(i => !i.parentTitle);
  const isArticle = i => i.type === 'ナレッジ' || (childrenByParent.get(i.title) || []).length > 0;

  const independentQA = topLevel.filter(i => !isArticle(i)).filter(i => {
    if (currentCat !== 'すべて' && i.category !== currentCat) return false;
    return !q ||
      i.title.toLowerCase().includes(q) ||
      (i.q||'').toLowerCase().includes(q) ||
      (i.body||'').toLowerCase().includes(q) ||
      (i.tags||[]).some(t => t.toLowerCase().includes(q));
  });

  const articles = topLevel.filter(i => isArticle(i)).filter(i => {
    if (currentCat !== 'すべて' && i.category !== currentCat) return false;
    if (!q) return true;
    const selfMatch =
      i.title.toLowerCase().includes(q) ||
      (i.body||'').toLowerCase().includes(q) ||
      (i.summary||'').toLowerCase().includes(q) ||
      (i.tags||[]).some(t => t.toLowerCase().includes(q));
    if (selfMatch) return true;
    // 子Q&Aにヒットした場合も親記事を表示
    return (childrenByParent.get(i.title) || []).some(c =>
      c.title.toLowerCase().includes(q) ||
      (c.q||'').toLowerCase().includes(q) ||
      (c.body||'').toLowerCase().includes(q) ||
      (c.tags||[]).some(t => t.toLowerCase().includes(q))
    );
  });

  return { independentQA, articles };
}

function renderFaqCard(item, id) {
  return `
    <div class="faq-card" id="${id}">
      <div class="faq-header" onclick="document.getElementById('${id}').classList.toggle('open')">
        <div class="faq-q">${esc(item.title)}</div>
        <span class="faq-chevron">›</span>
      </div>
      <div class="faq-body">
        <div class="faq-a"><div class="faq-a-body"><div class="md-body">${md2html(item.body)}</div></div></div>
        <div class="faq-footer">
          <span class="badge badge-${catColor(item.category)}">${esc(item.category)}</span>
          <span class="tag">${esc(item.type)}</span>
          ${(item.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          <span style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">${esc(item.updated||'')}</span>
        </div>
      </div>
    </div>`;
}

function renderChildFaqCard(child, id) {
  return `
    <div class="child-faq-card" id="${id}">
      <div class="child-faq-header" onclick="document.getElementById('${id}').classList.toggle('open')">
        <div class="faq-q">${esc(child.title)}</div>
        <span class="faq-chevron">›</span>
      </div>
      <div class="child-faq-body">
        <div class="faq-a"><div class="faq-a-body"><div class="md-body">${md2html(child.body)}</div></div></div>
        <div class="faq-footer">
          ${(child.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          <span style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">${esc(child.updated||'')}</span>
        </div>
      </div>
    </div>`;
}

function renderArticleCard(item, i) {
  const children = childrenByParent.get(item.title) || [];
  const childrenHtml = children.length ? `
    <div class="child-qa-section">
      <div class="child-qa-label">関連Q&amp;A (${children.length})</div>
      ${children.map((c, ci) => renderChildFaqCard(c, `art-${i}-c${ci}`)).join('')}
    </div>` : '';
  const summaryText = item.summary || (item.q ? item.q : '');
  const summaryBadge = children.length
    ? `${esc(summaryText)} <span class="child-qa-badge">${children.length}件のQ&amp;A</span>`
    : esc(summaryText);
  return `
    <div class="article-card" id="art-${i}">
      <div class="article-header" onclick="document.getElementById('art-${i}').classList.toggle('open')">
        <div>
          <div class="article-title">${esc(item.title)}</div>
          <div class="article-summary">${summaryBadge}</div>
        </div>
        <span class="article-chevron">›</span>
      </div>
      <div class="article-body">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:.75rem;flex-wrap:wrap">
          <span class="badge badge-${catColor(item.category)}">${esc(item.category)}</span>
          <span class="tag">${esc(item.type)}</span>
          ${(item.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          <span style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">${esc(item.updated||'')}</span>
        </div>
        ${item.q ? `<div class="faq-a" style="margin-bottom:.75rem"><div class="faq-a-body"><div class="md-body">${md2html(item.body)}</div></div></div>` : `<div class="md-body">${md2html(item.body)}</div>`}
        ${childrenHtml}
      </div>
    </div>`;
}

// 種別の文字列（Notionの選択肢名）ではなく、質問列の有無でカード形式を判定する。
// 「親ナレッジ」が設定された子Q&Aは記事カード内にネスト表示し、トップレベルには出さない。
function render() {
  const { independentQA, articles } = filterItems();
  const topLevelCount = allItems.filter(i => !i.parentTitle).length;
  document.getElementById('resultCount').textContent =
    `${independentQA.length + articles.length}件 表示中（全${topLevelCount}件）`;

  const qaSec = document.getElementById('qaSection');
  qaSec.style.display = independentQA.length ? '' : 'none';
  document.getElementById('qaList').innerHTML =
    independentQA.map((item, i) => renderFaqCard(item, `faq-${i}`)).join('') ||
    '<div class="empty">該当するQ&amp;Aがありません</div>';

  const artSec = document.getElementById('articleSection');
  artSec.style.display = articles.length ? '' : 'none';
  document.getElementById('articleList').innerHTML =
    articles.map((item, i) => renderArticleCard(item, i)).join('') ||
    '<div class="empty">該当する記事がありません</div>';

  if (independentQA.length === 0 && articles.length === 0) {
    qaSec.style.display = '';
    document.getElementById('qaList').innerHTML =
      `<div class="empty">「${esc(currentQuery)}」に一致するナレッジが見つかりませんでした</div>`;
    artSec.style.display = 'none';
  }
}


async function init() {
  try {
    const res  = await fetch('data/knowledge.csv');
    const buf  = await res.arrayBuffer();
    const text = new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/, '');
    const rows = Papa.parse(text, { header:true, skipEmptyLines:true }).data;

    allItems = rows.map((r,i) => ({
      id:          String(i).padStart(3,'0'),
      title:       (r['タイトル']||'').trim(),
      type:        (r['種別']||'faq').trim(),
      category:    (r['カテゴリ']||'社内ルール').trim(),
      q:           (r['質問']||'').trim(),
      body:        (r['回答・本文']||'').trim(),
      summary:     (r['サマリー']||'').trim(),
      tags:        (r['タグ']||'').split(',').map(t=>t.trim()).filter(Boolean),
      updated:     (r['更新日']||'').trim(),
      parentTitle: (r['親ナレッジ']||'').trim(),
    })).filter(r=>r.title);

    // 親タイトル → 子Q&Aリスト のマップを構築
    childrenByParent = new Map();
    for (const item of allItems) {
      if (!item.parentTitle) continue;
      if (!childrenByParent.has(item.parentTitle)) childrenByParent.set(item.parentTitle, []);
      childrenByParent.get(item.parentTitle).push(item);
    }

    // カテゴリは親記事（トップレベル）の出現順に色を自動割り当てる。子Q&Aはカウントから除外。
    const topLevel = allItems.filter(i => !i.parentTitle);
    const categories = [...new Set(topLevel.map(i=>i.category))];
    categories.forEach((cat,i) => { catColorMap[cat] = CAT_PALETTE[i % CAT_PALETTE.length]; });
    const CATEGORIES = ['すべて', ...categories];

    const fEl = document.getElementById('filters');
    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn'+(cat==='すべて'?' active':'');
      btn.textContent = cat==='すべて'
        ? `すべて (${topLevel.length})`
        : `${cat} (${topLevel.filter(i=>i.category===cat).length})`;
      btn.onclick = () => {
        currentCat = cat;
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        render();
      };
      fEl.appendChild(btn);
    });

    document.getElementById('searchInput').addEventListener('input', e=>{ currentQuery=e.target.value; render(); });
    render();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-size:13px">⚠ data/knowledge.csv が読み込めませんでした<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}
init();
</script>
</body>
</html>
