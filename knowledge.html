<style>
.search-wrap{position:relative;margin-bottom:1.25rem}
.search-input{width:100%;padding:.65rem 1rem .65rem 2.5rem;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.filter-btn{font-size:12px;font-weight:500;padding:4px 12px;border-radius:999px;cursor:pointer;border:.5px solid var(--border);background:transparent;color:var(--text2);font-family:var(--font);transition:.15s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.active{background:var(--blue-dim);border-color:rgba(59,130,246,.4);color:var(--blue)}
.faq-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.faq-card:hover{border-color:var(--border2)}
.faq-header{padding:.9rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.faq-card-title{font-weight:700;font-size:13.5px;line-height:1.6;flex:1}
.faq-q{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:flex-start;line-height:1.6;flex:1}
.faq-q::before{content:'Q';font-family:var(--mono);font-size:11px;color:var(--blue);background:var(--blue-dim);padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:2px}
.faq-chevron{color:var(--text3);font-size:16px;flex-shrink:0;transition:transform .2s;margin-top:2px}
.faq-card.open .faq-chevron{transform:rotate(90deg)}
.faq-body{display:none;padding:0 1.1rem 1rem}
.faq-card.open .faq-body{display:block}
.faq-a{display:flex;gap:8px;align-items:flex-start}
.faq-a::before{content:'A';font-family:var(--mono);font-size:11px;color:var(--green);background:var(--green-dim);padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:2px}
.faq-a-body{flex:1;min-width:0}
.faq-footer{display:flex;gap:8px;align-items:center;margin-top:.6rem;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 7px;border-radius:3px;background:var(--bg3);color:var(--text3)}
.article-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.article-card:hover{border-color:var(--border2)}
.article-header{padding:.9rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.article-title{font-weight:700;font-size:14px}
.article-summary{font-size:12px;color:var(--text2);margin-top:3px}
.article-chevron{color:var(--text3);font-size:16px;flex-shrink:0;transition:transform .2s}
.article-card.open .article-chevron{transform:rotate(90deg)}
.article-body{display:none;padding:0 1.25rem 1.25rem}
.article-card.open .article-body{display:block}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:13px}
.result-count{font-size:12px;color:var(--text3);margin-bottom:1rem;font-family:var(--mono)}
.child-qa-section{margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1rem}
.child-qa-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.child-faq-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden}
.child-faq-header{padding:.7rem .9rem;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.child-faq-body{display:none;padding:0 .9rem .75rem}
.child-faq-card.open .child-faq-body{display:block}
.child-faq-card.open .faq-chevron{transform:rotate(90deg)}
.child-qa-badge{font-size:10px;background:var(--blue-dim);color:var(--blue);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.cat-group{margin-bottom:1.25rem}
.cat-group-header{display:flex;align-items:center;gap:10px;padding:.55rem .85rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;margin-bottom:8px;transition:border-color .15s,background .15s;user-select:none}
.cat-group-header:hover{border-color:var(--border2);background:var(--bg3)}
.cat-group-count{font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:auto}
.cat-group-chevron{color:var(--text3);font-size:16px;flex-shrink:0;transition:transform .2s}
.cat-group-header.open .cat-group-chevron{transform:rotate(90deg)}
.cat-group-body{display:none}
.cat-group-header.open + .cat-group-body{display:block}
.digest-card{background:var(--bg2);border:1px solid rgba(167,139,250,.28);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;margin-bottom:1.25rem;position:relative;overflow:hidden}
.digest-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--purple),var(--cyan))}
.digest-head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.digest-title{font-size:12px;font-weight:700;color:var(--text)}
.digest-count{font-size:10.5px;font-family:var(--mono);color:var(--purple);background:var(--purple-dim);border-radius:999px;padding:1px 8px}
.digest-sub{font-size:11px;color:var(--text3);margin-bottom:.7rem}
.digest-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:.5px solid var(--border);font-size:12.5px;cursor:pointer}
.digest-row:last-child{border-bottom:none}
.digest-row:hover .digest-item-title{color:var(--blue)}
.digest-status{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;flex-shrink:0;font-family:var(--mono)}
.digest-status.new{background:var(--purple-dim);color:var(--purple)}
.digest-status.upd{background:var(--cyan-dim);color:var(--cyan)}
.digest-item-title{flex:1;min-width:0;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.digest-time{font-size:10.5px;color:var(--text3);font-family:var(--mono);flex-shrink:0}
.digest-more{font-size:11px;color:var(--text3);margin-top:2px}
.item-update-badge{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:999px;font-family:var(--mono);letter-spacing:.02em;margin-right:6px;vertical-align:middle;display:inline-block}
.item-update-badge.new{background:var(--purple-dim);color:var(--purple)}
.item-update-badge.upd{background:var(--cyan-dim);color:var(--cyan)}
</style>

<body>

<div id="loading"><div class="spinner"></div><span>ナレッジを読み込んでいます...</span></div>
<div id="app">
<main class="main">
  <div class="page-header with-you">
    <div>
      <h1>ナレッジ・FAQ</h1>
      <p>社内ルール・よくある問い合わせ・技術Tips</p>
    </div>

    <div class="you-mini" id="youMini" style="display:none">

      <div class="you-mini-card" id="youCard">

        <div class="you-mini-dropdown" id="youDropdown">

          <div class="you-mini-dropdown-foot">

  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" type="text" placeholder="キーワードで検索..." autocomplete="off">
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem" id="filters"></div>

<script src="nav.js"></script>
<script src="md.js"></script>
<script src="data.js"></script>

<script>
const CAT_PALETTE = ['blue','green','amber','purple','cyan','red'];
let allItems = [], currentCat = 'すべて', currentQuery = '';
let catColorMap = {};
let childrenByParent = new Map();
const esc = window.escapeHTML;

function catColor(cat) { return catColorMap[cat] || 'blue'; }

// ── 更新インジケーター ─────────────────────────────
// 「更新日」を前回訪問時にlocalStorageへ記憶したタイトル→更新日と突き合わせ、
// 差分がある項目だけをNEW/更新としてハイライトする。ブラウザをまたぐと引き継がれないため、
// どちらでも更新日からUPDATE_BADGE_DAYS日を過ぎたら強制的に消えるようにして「消えないバッジ」を防ぐ。
const UPDATE_BADGE_DAYS = 14;
const UPDATE_SEEN_KEY = 'knowledge_seen_state';
const UPDATE_DIGEST_LIMIT = 6;

function daysSince(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  const today = new Date();
  const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor((today0 - d0) / (1000*60*60*24));
}

function formatRelative(dateStr) {
  const days = daysSince(dateStr);
  if (days === 0) return '今日';
  if (days === 1) return '1日前';
  if (days < 7) return `${days}日前`;
  return `${Math.floor(days/7)}週間前`;
}

// トップレベル項目にupdateStatus（'new'|'upd'|undefined）を付与し、対象一覧を返す。
// 呼び出し時点のlocalStorage状態と比較した後、今回の内容を「見た状態」として書き戻す。
function computeUpdateBadges(topLevel) {
  let prevState = {};
  try { prevState = JSON.parse(localStorage.getItem(UPDATE_SEEN_KEY) || '{}'); } catch(e) {}

  const updates = [];
  topLevel.forEach(item => {
    if (!item.updated) return;
    const days = daysSince(item.updated);
    if (days === null || days < 0 || days > UPDATE_BADGE_DAYS) return;
    const prevUpdated = prevState[item.title];
    const status = prevUpdated === undefined ? 'new' : (prevUpdated !== item.updated ? 'upd' : null);
    if (!status) return;
    item.updateStatus = status;
    updates.push(item);
  });
  updates.sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));

  const nextState = {};
  topLevel.forEach(item => { if (item.updated) nextState[item.title] = item.updated; });
  try { localStorage.setItem(UPDATE_SEEN_KEY, JSON.stringify(nextState)); } catch(e) {}

  return updates;
}

function renderDigest(updates) {
  const card = document.getElementById('digestCard');
  if (!updates.length) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  document.getElementById('digestCount').textContent = `${updates.length}件`;
  const shown = updates.slice(0, UPDATE_DIGEST_LIMIT);
  const overflow = updates.length - shown.length;
  document.getElementById('digestBody').innerHTML =
    shown.map(item => `
      <div class="digest-row" data-title="${esc(item.title)}">
        <span class="digest-status ${item.updateStatus}">${item.updateStatus === 'new' ? 'NEW' : '更新'}</span>
        <span class="digest-item-title">${esc(item.title)}</span>
        <span class="badge badge-${catColor(item.category)}">${esc(item.category)}</span>
        <span class="digest-time">${formatRelative(item.updated)}</span>
      </div>`).join('')
    + (overflow > 0 ? `<div class="digest-more">ほか${overflow}件</div>` : '');
  document.querySelectorAll('.digest-row').forEach(row => {
    row.addEventListener('click', () => jumpToItem(row.dataset.title));
  });
}

// 「最近の更新」から該当項目へジャンプ：カテゴリ絞り込み・検索キーワードは触らずリセットした状態で該当カードだけを開く
// （検索欄にタイトルを入れて絞り込む方式だと、ジャンプ後に検索欄の文字列が残り続け、
// 「すべて」タブ等を押しても意図せず絞り込まれたままになりバグに見えたため2026-08-19に変更）
function jumpToItem(title) {
  currentCat = 'すべて';
  currentQuery = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.filter-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  render();
  // render()はinnerHTMLの同期更新なので、直後にクエリしても新しいカードは既にDOM上にある
  const titleEl = [...document.querySelectorAll('.faq-card-title, .article-title')]
    .find(el => el.textContent.trim() === title.trim() || el.textContent.includes(title));
  if (!titleEl) return;
  const card = titleEl.closest('.faq-card, .article-card');
  if (!card) return;
  card.classList.add('open');
  const catHeader = card.closest('.cat-group')?.querySelector('.cat-group-header');
  if (catHeader) catHeader.classList.add('open');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// 「親ナレッジ」が設定されている = 記事の子Q&A。
// 種別=ナレッジ → 記事・ガイドセクション。種別=FAQ/手順 → Q&Aセクション。
// 子Q&Aを持つアイテムは種別によらず記事・ガイドとして扱う。
function filterItems() {
  const q = currentQuery.toLowerCase();
  const topLevel = allItems.filter(i => !i.parentTitle);
  const isArticle = i => i.type === 'ナレッジ' || (childrenByParent.get(i.title) || []).length > 0;

  const independentQA = topLevel.filter(i => !isArticle(i)).filter(i => {
    if (currentCat !== 'すべて' && i.category !== currentCat) return false;
    return !q ||
      i.title.toLowerCase().includes(q) ||
      (i.q||'').toLowerCase().includes(q) ||
      (i.body||'').toLowerCase().includes(q) ||
      (i.tags||[]).some(t => t.toLowerCase().includes(q));
  });

  const articles = topLevel.filter(i => isArticle(i)).filter(i => {
    if (currentCat !== 'すべて' && i.category !== currentCat) return false;
    if (!q) return true;
    const selfMatch =
      i.title.toLowerCase().includes(q) ||
      (i.body||'').toLowerCase().includes(q) ||
      (i.summary||'').toLowerCase().includes(q) ||
      (i.tags||[]).some(t => t.toLowerCase().includes(q));
    if (selfMatch) return true;
    // 子Q&Aにヒットした場合も親記事を表示
    return (childrenByParent.get(i.title) || []).some(c =>
      c.title.toLowerCase().includes(q) ||
      (c.q||'').toLowerCase().includes(q) ||
      (c.body||'').toLowerCase().includes(q) ||
      (c.tags||[]).some(t => t.toLowerCase().includes(q))
    );
  });

  return { independentQA, articles };
}

function renderFaqCard(item, id) {
  return `
    <div class="faq-card" id="${id}">
      <div class="faq-header" onclick="document.getElementById('${id}').classList.toggle('open')">
        <div class="faq-card-title">${item.updateStatus ? `<span class="item-update-badge ${item.updateStatus}">${item.updateStatus === 'new' ? 'NEW' : '更新'}</span>` : ''}${esc(item.title)}</div>
        <span class="faq-chevron">›</span>
      </div>
      <div class="faq-body">
        ${item.q ? `<div class="faq-q" style="margin-bottom:.75rem">${esc(item.q)}</div>` : ''}
        <div class="faq-a"><div class="faq-a-body"><div class="md-body">${md2html(item.body)}</div></div></div>
        <div class="faq-footer">
          <span class="badge badge-${catColor(item.category)}">${esc(item.category)}</span>
          <span class="tag">${esc(item.type)}</span>
          ${(item.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          <span style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">${esc(item.updated||'')}</span>
        </div>
      </div>
    </div>`;
}

function renderChildFaqCard(child, id) {
  return `
    <div class="child-faq-card" id="${id}">
      <div class="child-faq-header" onclick="document.getElementById('${id}').classList.toggle('open')">
        <div class="faq-card-title">${esc(child.title)}</div>
        <span class="faq-chevron">›</span>
      </div>
      <div class="child-faq-body">
        ${child.q ? `<div class="faq-q" style="margin-bottom:.75rem">${esc(child.q)}</div>` : ''}
        <div class="faq-a"><div class="faq-a-body"><div class="md-body">${md2html(child.body)}</div></div></div>
        <div class="faq-footer">
          ${(child.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          <span style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">${esc(child.updated||'')}</span>
        </div>
      </div>
    </div>`;
}

function renderArticleCard(item, artId) {
  const children = childrenByParent.get(item.title) || [];
  const childrenHtml = children.length ? `
    <div class="child-qa-section">
      <div class="child-qa-label">関連Q&amp;A (${children.length})</div>
      ${children.map((c, ci) => renderChildFaqCard(c, `${artId}-c${ci}`)).join('')}
    </div>` : '';
  const summaryText = item.summary || (item.q ? item.q : '');
  const summaryBadge = children.length
    ? `${esc(summaryText)} <span class="child-qa-badge">${children.length}件のQ&amp;A</span>`
    : esc(summaryText);
  return `
    <div class="article-card" id="${artId}">
      <div class="article-header" onclick="document.getElementById('${artId}').classList.toggle('open')">
        <div>
          <div class="article-title">${item.updateStatus ? `<span class="item-update-badge ${item.updateStatus}">${item.updateStatus === 'new' ? 'NEW' : '更新'}</span>` : ''}${esc(item.title)}</div>
          <div class="article-summary">${summaryBadge}</div>
        </div>
        <span class="article-chevron">›</span>
      </div>
      <div class="article-body">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:.75rem;flex-wrap:wrap">
          <span class="badge badge-${catColor(item.category)}">${esc(item.category)}</span>
          <span class="tag">${esc(item.type)}</span>
          ${(item.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          <span style="margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)">${esc(item.updated||'')}</span>
        </div>
        ${item.q ? `<div class="faq-q" style="margin-bottom:.75rem">${esc(item.q)}</div><div class="faq-a" style="margin-bottom:.75rem"><div class="faq-a-body"><div class="md-body">${md2html(item.body)}</div></div></div>` : `<div class="md-body">${md2html(item.body)}</div>`}
        ${childrenHtml}
      </div>
    </div>`;
}

// 「すべて」表示時：カテゴリ単位のアコーディオングループで表示
function renderGrouped(independentQA, articles) {
  const all = [...independentQA, ...articles];
  if (all.length === 0) {
    return `<div class="empty">${currentQuery ? `「${esc(currentQuery)}」に一致するナレッジが見つかりませんでした` : '該当するナレッジがありません'}</div>`;
  }
  const catOrder = Object.keys(catColorMap);
  const cats = [...new Set(all.map(i => i.category))].sort((a, b) => catOrder.indexOf(a) - catOrder.indexOf(b));

  return cats.map((cat, gi) => {
    const qaItems = independentQA.filter(i => i.category === cat);
    const artItems = articles.filter(i => i.category === cat);
    const total = qaItems.length + artItems.length;
    const content = [
      ...qaItems.map((item, i) => renderFaqCard(item, `faq-g${gi}-${i}`)),
      ...artItems.map((item, i) => renderArticleCard(item, `art-g${gi}-${i}`)),
    ].join('');
    return `
      <div class="cat-group">
        <div class="cat-group-header" onclick="this.classList.toggle('open')">
          <span class="badge badge-${catColor(cat)}" style="font-size:12px;padding:3px 10px">${esc(cat)}</span>
          <span class="cat-group-count">${total}件</span>
          <span class="cat-group-chevron">›</span>
        </div>
        <div class="cat-group-body">${content}</div>
      </div>`;
  }).join('');
}

// 特定カテゴリ選択時：Q&A / 記事・ガイドをセクション分けして表示
function renderFlat(independentQA, articles) {
  let html = '';
  if (independentQA.length) {
    html += `<div class="section-label">Q&amp;A</div>`;
    html += independentQA.map((item, i) => renderFaqCard(item, `faq-${i}`)).join('');
  }
  if (articles.length) {
    html += `<div class="section-label">記事・ガイド</div>`;
    html += articles.map((item, i) => renderArticleCard(item, `art-${i}`)).join('');
  }
  if (!independentQA.length && !articles.length) {
    html = `<div class="empty">該当するナレッジがありません</div>`;
  }
  return html;
}

function render() {
  const { independentQA, articles } = filterItems();
  const topLevelCount = allItems.filter(i => !i.parentTitle).length;
  document.getElementById('resultCount').textContent =
    `${independentQA.length + articles.length}件 表示中（全${topLevelCount}件）`;
  document.getElementById('contentArea').innerHTML =
    currentCat === 'すべて' ? renderGrouped(independentQA, articles) : renderFlat(independentQA, articles);
}


async function init() {
  try {
    const { text } = await fetchCSVText('data/knowledge.csv');
    const rows = Papa.parse(text, { header:true, skipEmptyLines:true }).data;

    allItems = rows.map((r,i) => ({
      id:          String(i).padStart(3,'0'),
      title:       (r['タイトル']||'').trim(),
      type:        (r['種別']||'faq').trim(),
      category:    (r['カテゴリ']||'社内ルール').trim(),
      q:           (r['質問']||'').trim(),
      body:        (r['回答・本文']||'').trim(),
      summary:     (r['サマリー']||'').trim(),
      tags:        (r['タグ']||'').split(',').map(t=>t.trim()).filter(Boolean),
      updated:     (r['更新日']||'').trim(),
      parentTitle: (r['親ナレッジ']||'').trim(),
    })).filter(r=>r.title);

    // 親タイトル → 子Q&Aリスト のマップを構築
    childrenByParent = new Map();
    for (const item of allItems) {
      if (!item.parentTitle) continue;
      if (!childrenByParent.has(item.parentTitle)) childrenByParent.set(item.parentTitle, []);
      childrenByParent.get(item.parentTitle).push(item);
    }

    // カテゴリは親記事（トップレベル）の出現順に色を自動割り当てる。子Q&Aはカウントから除外。
    const topLevel = allItems.filter(i => !i.parentTitle);
    const categories = [...new Set(topLevel.map(i=>i.category))];
    categories.forEach((cat,i) => { catColorMap[cat] = CAT_PALETTE[i % CAT_PALETTE.length]; });
    const CATEGORIES = ['すべて', ...categories];

    const fEl = document.getElementById('filters');
    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn'+(cat==='すべて'?' active':'');
      btn.textContent = cat==='すべて'
        ? `すべて (${topLevel.length})`
        : `${cat} (${topLevel.filter(i=>i.category===cat).length})`;
      btn.onclick = () => {
        currentCat = cat;
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        render();
      };
      fEl.appendChild(btn);
    });

    document.getElementById('searchInput').addEventListener('input', e=>{ currentQuery=e.target.value; render(); });
    renderDigest(computeUpdateBadges(topLevel));
    render();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-size:13px">⚠ data/knowledge.csv が読み込めませんでした<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}
init();
</script>
