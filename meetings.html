<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライン別会議実施計画 — 第1ライン FY2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
.policy-list { font-size: 13px; color: var(--text2); line-height: 1.9; padding-left: 1.25rem; }
.policy-list li { margin-bottom: .3rem; }
.unit-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.unit-単独 { background: var(--blue-dim); color: var(--blue); }
.unit-合同 { background: var(--purple-dim); color: var(--purple); }
.format-chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-right: 4px; display: inline-block; background: var(--bg3); color: var(--text2); }
.format-職場別 { background: var(--cyan-dim); color: var(--cyan); }
.format-懇親会 { background: var(--amber-dim); color: var(--amber); }
.doc-link { color: var(--blue); font-size: 12px; text-decoration: none; white-space: nowrap; }
.doc-link:hover { text-decoration: underline; }
.plan-tbl { table-layout: fixed; }
.plan-tbl td.left { white-space: normal; }
/* スマホ幅：固定%レイアウトのままだと列が詰まって読みにくいため、他表と同じ横スクロール表示に切り替える */
@media (max-width: 700px) {
  .plan-tbl { table-layout: auto; min-width: 640px; }
  .plan-tbl col { width: auto !important; }
  .plan-tbl td.left { white-space: nowrap; }
  /* 備考のみ自由記述で長文が入り得るため、折り返しを維持して表が際限なく横に伸びるのを防ぐ */
  .plan-tbl td.left:nth-child(5) { white-space: normal; max-width: 220px; }
}
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="loading"><div class="spinner"></div><span>会議予定を読み込んでいます...</span></div>
<div id="app">
<main class="main">
  <div class="page-header with-you">
    <div>
      <h1>ライン別会議実施計画</h1>
      <p id="subtitle">—</p>
    </div>

    <div class="you-mini" id="youMini" style="display:none">
      <div class="card-title" style="margin-bottom:6px">🙋 あなたの状況</div>
      <div class="you-mini-card" id="youCard">
        <button class="you-mini-head" id="youMiniHead" aria-haspopup="true" aria-expanded="false">
          <span class="you-mini-avatar" id="youAvatar">?</span>
          <span class="you-mini-headtext">
            <span class="you-mini-name" id="youName">選択してください</span>
            <span class="you-mini-hint">タップで詳細・切替</span>
          </span>
          <span class="you-mini-caret-wrap">▾</span>
        </button>

        <span class="you-mini-vdiv"></span>

        <div class="you-mini-stats" id="youStats"></div>

        <div class="you-mini-dropdown" id="youDropdown">
          <div class="you-mini-dropdown-label">表示する人を選択</div>
          <div class="you-mini-chip-list" id="youChips"></div>
          <div class="you-mini-dropdown-foot">
            <span id="youFootNote">初回だけ選ぶと、次回から自動でこの人の状況が表示されます（このブラウザに記憶）</span><br>
            <button class="you-mini-reset" id="youReset" style="display:none">記憶をリセット</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-title">📋 方針</div>
    <ul class="policy-list">
      <li>基本的には毎月第1金曜日＝全体会議日の定時後に実施する</li>
      <li>対面での実施を基本とする（事業所で落とし込み等を行った上で、懇親の場を設けるなど）</li>
      <li>終日版全体会議の日は職場別会議を代用とする</li>
      <li>皆で作る会議にする</li>
    </ul>
  </div>

  <div class="card">
    <div class="card-title">🗓️ 実施計画</div>
    <div id="tableWrap"></div>
  </div>

</main>
</div>

<script src="nav.js"></script>
<script src="data.js"></script>
<script src="you-widget.js"></script>
<script>
function escHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeHref(url) {
  return /^https?:\/\//i.test(url) ? escHTML(url) : null;
}
async function init() {
  try {
    const { text } = await fetchCSVText('data/meeting_plan.csv');
    const rows = Papa.parse(text, { header: true, skipEmptyLines: true }).data;

    document.getElementById('subtitle').textContent =
      `${new Date().toLocaleDateString('ja-JP')} 時点 ／ 全${rows.length}回`;

    const today = new Date();
    const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    function parseJaDate(str) {
      const m = String(str||'').match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
    }

    const tableWrap = document.getElementById('tableWrap');
    tableWrap.innerHTML = `<div class="tbl-wrap"><table class="tbl plan-tbl">
      <colgroup>
        <col style="width:9%"><col style="width:11%"><col style="width:8%">
        <col style="width:13%"><col style="width:24%"><col style="width:35%">
      </colgroup>
      <thead><tr>
        <th class="left">実施月</th><th class="left">実施日</th><th>開催単位</th>
        <th class="left">実施形式</th><th class="left">備考</th><th class="left">資料</th>
      </tr></thead>
      <tbody>${rows.map(r => {
        const d = parseJaDate(r['実施日']);
        const isPast = d && d < today0;
        const links = ((r['資料リンク']||'').split(',').map(s=>s.trim()).filter(Boolean).map(part => {
          const sep = part.indexOf('|');
          const name = sep !== -1 ? part.slice(0, sep).trim() : '';
          const url  = safeHref(sep !== -1 ? part.slice(sep + 1) : part);
          return url ? { name, url } : null;
        }).filter(Boolean)).map((l, i, arr) => ({ ...l, name: l.name || (arr.length > 1 ? `資料${i+1}` : '資料') }));
        const unit = (r['開催単位']||'').trim();
        return `<tr style="${isPast?'opacity:.5':''}">
          <td class="left" style="font-weight:500">${escHTML(r['実施月'])}</td>
          <td class="left">${escHTML(r['実施日'])}</td>
          <td>${unit?`<span class="unit-badge unit-${escHTML(unit)}">${escHTML(unit)}</span>`:''}</td>
          <td class="left">${(r['実施形式']||'').split(',').map(s=>s.trim()).filter(Boolean).map(f=>`<span class="format-chip format-${escHTML(f)}">${escHTML(f)}</span>`).join('')}</td>
          <td class="left" style="color:var(--text3)">${escHTML(r['備考']||'')}</td>
          <td class="left">${links.length ? links.map(l=>`<a class="doc-link" href="${l.url}" target="_blank" rel="noopener">${escHTML(l.name)}</a>`).join(' ') : '<span style="color:var(--text3)">—</span>'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-size:13px">⚠ データの読み込みに失敗しました<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}
init();
</script>
</body>
</html>
