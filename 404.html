<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません</title>
<!--
  Cloudflare Pagesは、ルートに404.htmlが無いと「SPA」とみなして、存在しないパスすべてに
  index.htmlをHTTP 200で返す。その結果、data/配下のCSVが消えてもfetchが「成功」扱いになり、
  各ページがindex.htmlをCSVとしてパースして「0件」と表示してしまっていた（エラーに気づけない）。
  このファイルを置くことで、存在しないパスは正しくHTTP 404になる。
  /data/xxx.csv のような深い階層でも表示されるため、style.css等は読まずインラインで完結させている。
  ページではないため functions/_middleware.js の PAGES には載せない（直接 /404.html を開いても配信許可リストで404になる）。
-->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f1117; color: #e5e7eb; font-family: 'Noto Sans JP', sans-serif; padding: 16px; box-sizing: border-box; }
  .box { text-align: center; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
  p { font-size: 13px; color: #9ca3af; margin: 0 0 20px; }
  a { display: inline-block; padding: 8px 18px; border-radius: 999px; font-size: 13px; text-decoration: none;
      background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.45); color: #93c5fd; }
  a:hover { background: rgba(59,130,246,0.28); color: #dbeafe; }
</style>
</head>
<body>
  <div class="box">
    <h1>ページが見つかりません</h1>
    <p>URLが間違っているか、ページが移動・削除された可能性があります。</p>
    <a href="/">ダッシュボードのトップへ</a>
  </div>
</body>
</html>
