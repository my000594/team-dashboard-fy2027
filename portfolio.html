<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポートフォリオ — 第1ライン FY2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="style.css">
<style>
#app{opacity:0;transition:opacity .4s}
#app.ready{opacity:1}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);text-decoration:none;margin-bottom:1.25rem;transition:color .15s}
.back-link:hover{color:var(--text)}
.hero{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;display:flex;gap:1.75rem;align-items:flex-start;margin-bottom:1.5rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.hero-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border2);flex-shrink:0}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hero-role{font-size:12.5px;color:var(--text2);margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-meta{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:.9rem}
.hero-meta-item{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:4px}
.hero-meta-item strong{color:var(--text2);font-weight:500}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.5rem}
@media(max-width:640px){.two-col{grid-template-columns:1fr}}
.pf-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1.5rem}
.pf-section{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.85rem;display:flex;align-items:center;gap:8px}
.pf-section::after{content:'';flex:1;height:1px;background:var(--border)}
.radar-wrap{position:relative;height:270px}
.strength-list{display:flex;flex-direction:column;gap:9px}
.strength-item{display:flex;align-items:center;gap:10px}
.strength-text{flex:1;min-width:0}
.strength-name{font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strength-sub{font-size:10px;color:var(--text3);margin-top:1px}
.strength-bar-bg{width:64px;flex-shrink:0;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.strength-bar-fill{height:100%;border-radius:3px}
.strength-lv{font-size:11px;font-family:var(--mono);color:var(--text3);width:14px;text-align:right;flex-shrink:0}
.domain-bars{display:flex;flex-direction:column;gap:10px}
.domain-row{display:flex;align-items:center;gap:10px}
.domain-label{font-size:11.5px;color:var(--text2);width:116px;flex-shrink:0;line-height:1.3}
.domain-bar-bg{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.domain-bar-fill{height:100%;border-radius:4px}
.domain-avg{font-size:11px;font-family:var(--mono);color:var(--text3);width:28px;text-align:right;flex-shrink:0}
.cert-item{display:flex;gap:12px;padding:.65rem 0;border-bottom:.5px solid var(--border)}
.cert-item:last-child{border-bottom:none}
.cert-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.cert-info{flex:1;min-width:0}
.cert-name{font-size:13px;font-weight:600;line-height:1.4}
.cert-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cert-kind{font-size:10px;padding:1px 7px;border-radius:3px;background:var(--bg3);color:var(--text2)}
.cert-expiry-ok{font-size:10px;color:var(--green);background:var(--green-dim);padding:1px 6px;border-radius:3px;font-family:var(--mono)}
.cert-expiry-warn{font-size:10px;color:var(--amber);background:var(--amber-dim);padding:1px 6px;border-radius:3px;font-family:var(--mono)}
.cert-expiry-ng{font-size:10px;color:var(--red);background:var(--red-dim);padding:1px 6px;border-radius:3px;font-family:var(--mono)}
.cert-badge-link{font-size:10.5px;color:var(--amber);text-decoration:none}
.cert-badge-link:hover{text-decoration:underline}
.cert-year{font-size:11px;font-family:var(--mono);color:var(--text3);flex-shrink:0;margin-top:3px}
.report-item{display:flex;align-items:center;gap:10px;padding:.55rem .75rem;background:var(--bg3);border-radius:var(--radius);font-size:12.5px;margin-bottom:6px}
.report-date{font-family:var(--mono);color:var(--text3);font-size:11px;flex-shrink:0}
.report-link{margin-left:auto;font-size:11px;color:var(--blue);text-decoration:none}
.report-link:hover{text-decoration:underline}
.no-data{font-size:12px;color:var(--text3);padding:.5rem 0}
/* メンバー未指定時のセレクタ */
.member-select-wrap{max-width:560px;margin:3rem auto;text-align:center}
.member-select-title{font-size:14px;font-weight:600;margin-bottom:1.25rem;color:var(--text2)}
.member-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.member-chip{display:flex;align-items:center;gap:8px;padding:.45rem .85rem;background:var(--bg2);border:1px solid var(--border);border-radius:999px;cursor:pointer;font-size:13px;transition:border-color .15s}
.member-chip:hover{border-color:var(--border2)}
.member-chip-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover}
.member-chip-fb{width:24px;height:24px;border-radius:50%;background:var(--blue-dim);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
@media(max-width:500px){.hero{flex-direction:column;gap:1rem}.hero-photo{width:64px;height:64px}}
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="loading"><div class="spinner"></div><span>読み込んでいます...</span></div>
<div id="app">
<main class="main">
  <div id="portfolioContent"></div>
</main>
</div>

<script src="nav.js"></script>
<script src="data.js"></script>
<script>
const PERIODS = ['2026年8月', '2026年11月', '2027年2月', '2027年5月'];
const IMG_BASE = 'data/members/';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function initials(name) {
  return name ? name.trim().charAt(0) : '?';
}

function avatarHTML(name, imgFile, sz = 80) {
  if (!imgFile) return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.38)}px;font-weight:700">${esc(initials(name))}</div>`;
  const imgL = IMG_BASE + imgFile.replace(/\.[^.]+$/, e => e.toLowerCase());
  const imgU = IMG_BASE + imgFile.replace(/\.[^.]+$/, e => e.toUpperCase());
  const fb = `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.38)}px;font-weight:700;flex-shrink:0">${esc(initials(name))}</div>`;
  return `<img src="${imgL}" data-upper="${imgU}" width="${sz}" height="${sz}" class="hero-photo" onerror="var u=this.getAttribute('data-upper');if(this.src!==u){this.src=u}else{this.outerHTML='${fb.replace(/'/g, "\\'")}'}" alt="${esc(name)}">`;
}

function detectLatestPeriod(skills) {
  for (let i = PERIODS.length - 1; i >= 0; i--) {
    if (skills.some(s => parseInt(s[PERIODS[i]] || '0') > 0)) return PERIODS[i];
  }
  return PERIODS[0];
}

function barColor(avg) {
  if (avg >= 4) return 'var(--green)';
  if (avg >= 3) return 'var(--blue)';
  if (avg >= 2) return 'var(--cyan)';
  if (avg >= 1) return 'var(--amber)';
  return 'var(--red)';
}

function expiryHTML(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const days = Math.floor((d - new Date()) / 86400000);
  if (days < 0) return `<span class="cert-expiry-ng">期限切れ</span>`;
  if (days <= 90) return `<span class="cert-expiry-warn">更新目安 ${dateStr}</span>`;
  return `<span class="cert-expiry-ok">有効期限 ${dateStr}</span>`;
}

function renderPortfolio(member, skills, certs, reports, allMembers) {
  const period = detectLatestPeriod(skills);

  // ── サブカテゴリ別平均 ──
  const subcatMap = {};
  for (const s of skills) {
    const key = s['サブカテゴリ'] || s['カテゴリ'] || '—';
    if (!subcatMap[key]) subcatMap[key] = { sum: 0, count: 0 };
    subcatMap[key].sum += parseInt(s[period] || '0');
    subcatMap[key].count++;
  }
  const subcatAvgs = Object.entries(subcatMap)
    .map(([label, { sum, count }]) => ({ label, avg: +(sum / count).toFixed(2) }));

  // ── 強みスキル（Lv.4以上）──
  const strengths = skills
    .filter(s => parseInt(s[period] || '0') >= 4)
    .map(s => ({ name: s['スキル名'], subcat: s['サブカテゴリ'] || s['カテゴリ'], lv: parseInt(s[period]), note: s['備考'] || '' }))
    .sort((a, b) => b.lv - a.lv);

  // ── 資格（取得日順）──
  const sortedCerts = [...certs].sort((a, b) => (a['資格取得日'] || '').localeCompare(b['資格取得日'] || ''));

  // ── HTML構築 ──
  const memberSwitchChips = allMembers.map(m => {
    const isSelf = m['氏名'].trim() === member['氏名'].trim();
    return `<span class="member-chip${isSelf ? ' active' : ''}" onclick="location.href='portfolio.html?member='+encodeURIComponent('${m['氏名'].trim()}')" style="${isSelf ? 'border-color:var(--blue);background:var(--blue-dim)' : ''}">${esc(m['氏名'].trim())}</span>`;
  }).join('');

  document.getElementById('portfolioContent').innerHTML = `
    <a class="back-link" href="member.html">← メンバー一覧に戻る</a>

    <div class="hero">
      ${avatarHTML(member['氏名'].trim(), member['画像']?.trim())}
      <div class="hero-info">
        <div class="hero-name">${esc(member['氏名'].trim())}</div>
        <div class="hero-role">
          ${member['役職'] ? `<span class="badge badge-blue">${esc(member['役職'].trim())}</span>` : ''}
          ${member['等級'] ? `<span class="badge badge-purple">${esc(member['等級'].trim())}</span>` : ''}
        </div>
        <div class="hero-meta">
          <div class="hero-meta-item">📅 入社 <strong>${esc(member['入社年月日']?.trim() || '—')}</strong></div>
          <div class="hero-meta-item">⏱ 社歴 <strong>${esc(member['社歴']?.trim() || '—')}</strong></div>
          ${member['支援先']?.trim() ? `<div class="hero-meta-item">🏢 支援先 <strong>${esc(member['支援先'].trim())}</strong></div>` : ''}
          ${member['委員会']?.trim() && member['委員会'].trim() !== '未所属' ? `<div class="hero-meta-item">👥 委員会 <strong>${esc(member['委員会'].trim())}</strong></div>` : ''}
        </div>
      </div>
    </div>

    <!-- メンバー切り替え -->
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center">
      <span style="font-size:11px;color:var(--text3);flex-shrink:0">他のメンバー：</span>
      ${memberSwitchChips}
    </div>

    <!-- スキル：レーダー + 強み -->
    <div class="two-col">
      <div class="pf-card" style="margin-bottom:0">
        <div class="pf-section">分野別スキル平均 <span style="font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text3)">${esc(period)}</span></div>
        <div class="radar-wrap"><canvas id="radarChart"></canvas></div>
      </div>
      <div class="pf-card" style="margin-bottom:0">
        <div class="pf-section">強みスキル（Lv.4以上）</div>
        ${strengths.length ? `<div class="strength-list">${strengths.map(s => `
          <div class="strength-item">
            <div class="strength-text">
              <div class="strength-name">${esc(s.name)}</div>
              <div class="strength-sub">${esc(s.subcat)}${s.note ? ` <span style="color:var(--text3)">/ ${esc(s.note)}</span>` : ''}</div>
            </div>
            <div class="strength-bar-bg"><div class="strength-bar-fill" style="width:${s.lv/5*100}%;background:${s.lv>=5?'var(--green)':'var(--blue)'}"></div></div>
            <div class="strength-lv">${s.lv}</div>
          </div>`).join('')}</div>`
        : `<div class="no-data">現在の評価時期（${esc(period)}）にLv.4以上のスキルがありません</div>`}
      </div>
    </div>

    <!-- 分野別バー -->
    <div class="pf-card">
      <div class="pf-section">分野別スキル分布</div>
      <div class="domain-bars">
        ${subcatAvgs.sort((a,b) => b.avg - a.avg).map(({label, avg}) => `
          <div class="domain-row">
            <div class="domain-label">${esc(label)}</div>
            <div class="domain-bar-bg"><div class="domain-bar-fill" style="width:${avg/5*100}%;background:${barColor(avg)}"></div></div>
            <div class="domain-avg">${avg.toFixed(1)}</div>
          </div>`).join('')}
      </div>
    </div>

    <!-- 資格 + 3SE -->
    <div class="two-col">
      <div class="pf-card" style="margin-bottom:0">
        <div class="pf-section">保有資格（取得年順）</div>
        ${sortedCerts.length ? sortedCerts.map(c => {
          const badges = (c['デジタルバッジ']||'').split(',').map(u=>u.trim()).filter(Boolean);
          return `<div class="cert-item">
            <div class="cert-dot" style="background:${c['資格区分']==='国家資格'?'var(--blue)':'var(--purple)'}"></div>
            <div class="cert-info">
              <div class="cert-name">${esc(c['資格名'].trim())}</div>
              <div class="cert-meta">
                <span class="cert-kind">${esc(c['資格区分']||'—')}</span>
                ${expiryHTML(c['有効期限']?.trim())}
                ${badges.map((u,i) => `<a class="cert-badge-link" href="${esc(u)}" target="_blank" rel="noopener">🏅${badges.length>1?` バッジ${i+1}`:' バッジ'}</a>`).join('')}
              </div>
            </div>
            <div class="cert-year">${(c['資格取得日']||'').slice(0,4)}</div>
          </div>`;
        }).join('') : `<div class="no-data">資格データがありません</div>`}
      </div>
      <div class="pf-card" style="margin-bottom:0">
        <div class="pf-section">3SEレポート（FY2027）</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:.85rem">提出数 <span style="font-size:1.3rem;font-weight:700;color:var(--text);font-family:var(--mono)">${reports.length}</span> 件</div>
        ${reports.length ? reports.sort((a,b)=>(b['提出日']||'').localeCompare(a['提出日']||'')).map((r,i) => `
          <div class="report-item">
            <div class="report-date">${esc(r['提出日']||'')}</div>
            <div style="font-size:12px;color:var(--text2)">レポート #${i+1}</div>
            ${r['ファイルリンク'] ? `<a class="report-link" href="${esc(r['ファイルリンク'])}" target="_blank" rel="noopener">見る →</a>` : ''}
          </div>`).join('')
        : `<div class="no-data">提出済みレポートがありません</div>`}
      </div>
    </div>
  `;

  // レーダーチャート描画
  const labels = subcatAvgs.map(s => s.label);
  const values = subcatAvgs.map(s => s.avg);
  new Chart(document.getElementById('radarChart').getContext('2d'), {
    type: 'radar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: 'rgba(59,130,246,0.15)',
        borderColor: '#3b82f6',
        borderWidth: 2,
        pointBackgroundColor: '#3b82f6',
        pointRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 5,
          ticks: { stepSize: 1, color: '#5c7494', font: { size: 9, family: 'DM Mono' }, backdropColor: 'transparent' },
          grid: { color: 'rgba(255,255,255,0.06)' },
          angleLines: { color: 'rgba(255,255,255,0.06)' },
          pointLabels: { color: '#94a3b8', font: { size: labels.length > 8 ? 9 : 10, family: 'Noto Sans JP' } },
        }
      },
      plugins: { legend: { display: false } }
    }
  });
}

function showMemberSelector(members) {
  document.getElementById('portfolioContent').innerHTML = `
    <div class="member-select-wrap">
      <div class="member-select-title">ポートフォリオを見るメンバーを選択してください</div>
      <div class="member-chips">
        ${members.map(m => `
          <div class="member-chip" onclick="location.href='portfolio.html?member='+encodeURIComponent('${m['氏名'].trim()}')">
            <span class="member-chip-fb">${esc(initials(m['氏名'].trim()))}</span>
            ${esc(m['氏名'].trim())}
          </div>`).join('')}
      </div>
    </div>`;
}

async function init() {
  try {
    const params = new URLSearchParams(location.search);
    const targetName = params.get('member') || localStorage.getItem('you_widget_member') || '';

    const [memberRes, skillRes, certRes, reportRes] = await Promise.all([
      fetchCSVText('data/members/member_master.csv'),
      fetchCSVText('data/skill.csv'),
      fetchCSVText('data/certifications.csv'),
      fetchCSVText('data/3se_report_archive.csv'),
    ]);

    const allMembers = Papa.parse(memberRes.text, { header: true, skipEmptyLines: true }).data
      .filter(r => (r['ステータス']||'').trim() === '在籍');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');

    const member = allMembers.find(m => m['氏名'].trim() === targetName);
    if (!member) { showMemberSelector(allMembers); return; }

    document.title = `${member['氏名'].trim()} — ポートフォリオ`;

    const skills = Papa.parse(skillRes.text, { header: true, skipEmptyLines: true }).data
      .filter(r => r['氏名']?.trim() === targetName);

    const certs = Papa.parse(certRes.text, { header: true, skipEmptyLines: true }).data
      .filter(r => r['氏名']?.trim() === targetName && !(r['資格分野']||'').includes('研修'));

    const reports = Papa.parse(reportRes.text, { header: true, skipEmptyLines: true }).data
      .filter(r => r['氏名']?.trim() === targetName);

    renderPortfolio(member, skills, certs, reports, allMembers);
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-size:13px">⚠ データの読み込みに失敗しました<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}
init();
</script>
</body>
</html>
