<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキルマップ — 第1ライン FY2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
.matrix-tbl{border-collapse:collapse;font-size:11px;min-width:100%}
.matrix-tbl th{font-size:10px;color:var(--text2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.matrix-tbl th.name-col{text-align:left;min-width:100px}
.matrix-tbl td{padding:5px 8px;border-bottom:.5px solid var(--border);text-align:center;vertical-align:middle}
.matrix-tbl td.name-col{text-align:left;font-weight:500;color:var(--text);max-width:160px;white-space:normal;overflow-wrap:break-word;line-height:1.3}
.matrix-tbl tbody tr:hover td{background:var(--bg3)}
/* 区分別・分野別のグループ区切り行。以前はグループごとに別々の<table>を組んでおり、
   資格名が少ないグループで名前列の幅が狭くなって列がずれて見えていたため、1つのtable内の区切り行に変更 */
.matrix-tbl tr.group-row td{background:var(--bg2);padding:.5rem .85rem;border-left:3px solid transparent;border-bottom:1px solid var(--border);text-align:left}
.matrix-tbl tr.group-row .g-name{font-size:12px;font-weight:500}
.matrix-tbl tr.group-row .g-count{font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:10px}
.skill-dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700}
.skill-dot-empty{color:var(--text3);font-size:15px}
.skill-note{font-size:10px;color:var(--text2);margin-top:2px;line-height:1.2;word-break:break-word}
.member-chip{padding:6px 12px;border-radius:999px;border:.5px solid var(--border);cursor:pointer;font-size:12px;color:var(--text2);background:transparent;font-family:var(--font);transition:.15s}
.member-chip:hover{border-color:var(--border2);color:var(--text)}
.member-chip.sel{background:var(--blue-dim);color:var(--blue);border-color:rgba(59,130,246,.4)}
.search-input{width:100%;padding:.65rem 1rem;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border-color .2s;margin-bottom:1.25rem}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--text3)}
.skill-result{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:7px 0;border-bottom:.5px solid var(--border)}
.skill-result:last-child{border-bottom:none}
.sr-name{font-size:12px;font-weight:500;color:var(--text);width:90px;flex-shrink:0}
.sr-bar-wrap{flex:1;background:var(--bg3);border-radius:3px;height:7px;overflow:hidden}
.sr-bar{height:100%;border-radius:3px}
.sr-lv{font-size:11px;font-family:var(--mono);color:var(--text2);min-width:34px;text-align:right}
.mobile-only{display:none}
/* 名前と値を横並びにすると、資格名など長い英語名が2行に折り返した時に右側の日付・バッジが窮屈に詰まって
   見づらくなるため、名前を1行目・値を2行目に積む縦積みレイアウトにしている */
.mobile-row{padding:9px 0;border-bottom:.5px solid var(--border);font-size:13px}
.mobile-row:last-child{border-bottom:none}
.mobile-row-name{color:var(--text);display:block;margin-bottom:5px}
.mobile-row-val{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.mobile-row-val .skill-note{margin-top:0;font-size:11px}
/* 幅が狭い画面ではメンバー×スキル／資格の横長マトリクスが窮屈になるため、
   メンバーを1人選んでスキル・資格を縦一覧で見るモバイル専用ビューに切り替える */
@media (max-width: 700px) {
  .desktop-only{display:none}
  .mobile-only{display:block}
}
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<div id="loading"><div class="spinner"></div><span>スキルデータを読み込んでいます...</span></div>
<div id="app">
<main class="main">
  <div class="page-header">
    <h1>スキルマップ</h1>
    <p id="subtitle">—</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--text3)">評価時期</span>
    <div class="tabs" id="periodTabs" style="margin-bottom:0"></div>
  </div>

  <details class="card" style="margin-bottom:1.25rem">
    <summary style="cursor:pointer;font-size:12px;font-weight:600;color:var(--text2)">📊 レベル基準を見る</summary>
    <div style="margin-top:.75rem;font-size:12px;color:var(--text2);line-height:1.8">
      <div><b style="color:var(--text);font-family:var(--mono)">Lv.1</b>　知っている（概念・用語を理解している）</div>
      <div><b style="color:var(--text);font-family:var(--mono)">Lv.2</b>　触ったことがある（学習・演習経験あり）</div>
      <div><b style="color:var(--text);font-family:var(--mono)">Lv.3</b>　業務で使える（実務経験あり・自力で対応可）</div>
      <div><b style="color:var(--text);font-family:var(--mono)">Lv.4</b>　得意（応用・改善ができる・他者に教えられる）</div>
      <div><b style="color:var(--text);font-family:var(--mono)">Lv.5</b>　エキスパート（高度な設計・問題解決・社内外で評価）</div>
    </div>
  </details>

  <div id="sec-matrix" class="tab-section">
    <div class="card mobile-only">
      <div class="card-title">👤 メンバーを選択</div>
      <div id="mobileMatrixChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>

    <div class="card">
      <div class="card-title">👤 メンバー × スキル一覧</div>
      <div id="matrixLegend" style="display:flex;gap:14px;font-size:11px;color:var(--text2);margin-bottom:10px;flex-wrap:wrap"></div>
      <div class="desktop-only" style="overflow-x:auto"><table class="matrix-tbl" id="matrixTable"></table></div>
      <div id="mobileSkillList" class="mobile-only"></div>
    </div>

    <div class="card" id="certifications" style="margin-top:1.25rem">
      <div class="card-title">💯 保有資格</div>
      <div class="tabs desktop-only" id="certViewTabs" style="margin-bottom:10px"></div>
      <div style="display:flex;gap:14px;font-size:11px;color:var(--text2);margin-bottom:10px;flex-wrap:wrap">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle"></span>保有</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin-right:5px;vertical-align:middle"></span>更新目安（期限まで90日以内）</span>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:middle"></span>期限切れ</span>
        <span style="color:var(--text2)">✓下の年月＝取得日／🏅バッジ＝デジタルバッジのリンク</span>
      </div>
      <div id="certContainer" class="desktop-only"></div>
      <div id="mobileCertList" class="mobile-only"></div>
    </div>
  </div>

  <div id="sec-radar" class="tab-section" style="display:none">
    <div class="card">
      <div class="card-title">🎯 メンバーを選択してスキルレーダーを表示</div>
      <div id="memberChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--text3)">分野</span>
        <div class="tabs" id="radarGroupTabs" style="margin-bottom:0"></div>
      </div>
      <div id="radarNote" style="font-size:11px;color:var(--text2);margin-bottom:.75rem"></div>
      <div class="chart-wrap" style="height:320px"><canvas id="radarChart" role="img" aria-label="選択したメンバーのスキルレーダーチャート"></canvas></div>
    </div>
  </div>

  <div id="sec-search" class="tab-section" style="display:none">
    <div class="card">
      <div class="card-title">🔍 スキルで検索</div>
      <input class="search-input" id="skillSearch" placeholder="スキル名を入力（例：Java、AWS、提案力）" oninput="filterSkills(this.value)" autocomplete="off">
      <div id="searchResult"></div>
    </div>
  </div>

</main>
</div>

<script src="nav.js"></script>
<script src="data.js"></script>
<script>
const TABS = [
  { id:'matrix', label:'マトリクス' },
  { id:'radar',  label:'レーダーチャート' },
  { id:'search', label:'スキル検索' },
];
// ヒアリング実施時期。新しい時期が追加されたらここに追記する（scripts/sync-notion.mjsのSKILL_PERIODSと対応）
const PERIODS = ['2026年8月','2026年11月','2027年2月','2027年5月'];
const CAT_PALETTE = ['blue','green','amber','purple','cyan','red'];
const OVERALL_GROUP = '__overall__'; // 「総合」タブ：分野（サブカテゴリ）ごとの平均レベルを表示

let members = [], skillList = [], dataByPeriod = {}, noteMap = {}, catColorMap = {}, categories = [], skillNameCounts = {};
let groups = [];
let certNames = [], certByMember = {}, certMeta = {};
const CERT_VIEWS = [
  { id: 'all',      label: '全体' },
  { id: 'category', label: '区分別' },
  { id: 'field',    label: '分野別' },
];
let currentCertView = 'all';
let currentPeriod = PERIODS[0];
let currentGroup = null;
let selectedMember = null;
let radarChart = null;

// Notion由来の自由記述テキストをHTML/属性値として安全に埋め込むためのエスケープ。
// 資格名が2026-07-28にselectから自由記述（title）に変わり、備考等と合わせて引用符を含む入力があり得るため
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function dataMap() { return dataByPeriod[currentPeriod] || {}; }

function catColor(cat) { return catColorMap[cat] || 'blue'; }

// 「その他（自由記入）」など同名スキルが複数のサブカテゴリにまたがる場合の表示ラベル（重複時のみサブカテゴリを併記）
function skillLabel(s) {
  return skillNameCounts[s.name] > 1 && s.sub ? `${s.name}（${s.sub}）` : s.name;
}

// レベル(1〜5)を4段階の意味づけで色分け（スキル検索の棒グラフ用）
function levelColor(v) {
  if (v >= 4) return { text: 'var(--green)' };
  if (v === 3) return { text: 'var(--blue)' };
  if (v === 2) return { text: 'var(--amber)' };
  return { text: 'var(--red)' };
}

function switchTab(id) {
  document.querySelectorAll('.tab-section').forEach(s => { s.style.display = (s.id === 'sec-' + id) ? '' : 'none'; });
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
}
window.switchTab = switchTab;

function switchPeriod(period) {
  currentPeriod = period;
  document.querySelectorAll('#periodTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.period === period));
  renderMatrix();
  if (selectedMember) { showRadar(selectedMember); renderMobileSkillList(selectedMember); }
  const searchInput = document.getElementById('skillSearch');
  if (searchInput.value.trim()) filterSkills(searchInput.value);
}
window.switchPeriod = switchPeriod;

// レーダーチャートは全スキルを一度に表示すると軸が密集して読めないため、サブカテゴリ単位（「分野」）で絞り込んで表示する。
// 「総合」は分野ごとの平均レベルを軸にした俯瞰用の表示
function switchRadarGroup(key) {
  currentGroup = key;
  document.querySelectorAll('#radarGroupTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.group === key));
  if (selectedMember) showRadar(selectedMember);
}
window.switchRadarGroup = switchRadarGroup;

// スキルレベルのドット＋備考のHTML断片。デスクトップのマトリクスセルとモバイルの縦一覧行の両方から使う
function skillDotHTML(v, cat, note) {
  if (v > 0) {
    const col = catColor(cat);
    return `<span class="skill-dot" style="background:var(--${col}-dim);color:var(--${col})"${note ? ` title="${esc(note)}"` : ''}>${v}</span>${note ? `<div class="skill-note">${esc(note)}</div>` : ''}`;
  }
  return `<span class="skill-dot-empty">・</span>`;
}

function renderMatrix() {
  const legend = document.getElementById('matrixLegend');
  legend.innerHTML = categories.map(c => {
    const col = catColor(c);
    return `<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--${col});margin-right:5px;vertical-align:middle"></span>${esc(c)}</span>`;
  }).join('') + `<span style="color:var(--text2)">●数字 = レベル（1〜5）／ ・ = 未評価</span>`;

  const table = document.getElementById('matrixTable');
  let html = '<thead><tr><th class="name-col">スキル</th>' +
    members.map(m => `<th>${esc(m)}</th>`).join('') +
    '</tr></thead><tbody>';
  const data = dataMap();
  skillList.forEach(s => {
    html += `<tr><td class="name-col">${esc(skillLabel(s))}</td>`;
    members.forEach(m => {
      const v = data[m]?.[s.key] || 0;
      const note = noteMap[m]?.[s.key];
      html += `<td>${skillDotHTML(v, s.cat, note)}</td>`;
    });
    html += '</tr>';
  });
  table.innerHTML = html + '</tbody>';
}

// メンバーを1人選んで縦一覧で見るモバイル専用ビュー（分野＝サブカテゴリごとにグルーピング）
function renderMobileSkillList(m) {
  const el = document.getElementById('mobileSkillList');
  if (!el || !m) return;
  const data = dataMap();
  el.innerHTML = groups.map((g, i) => {
    const col = catColor(g.items[0]?.cat);
    const rows = g.items.map(s => {
      const v = data[m]?.[s.key] || 0;
      const note = noteMap[m]?.[s.key];
      return `<div class="mobile-row"><span class="mobile-row-name">${esc(skillLabel(s))}</span><div class="mobile-row-val">${skillDotHTML(v, s.cat, note)}</div></div>`;
    }).join('');
    return `<div class="group-section">
      <div class="group-header" style="border-left-color:var(--${col})"><span class="group-title" style="color:var(--${col})">${esc(g.key)}</span><span class="group-count">${g.items.length}件</span></div>
      <div>${rows}</div>
    </div>`;
  }).join('');
}

// 取得日(ISO)を「YYYY/MM」表記に整形
function fmtCertDate(iso) {
  if (!iso) return '';
  const [y, m] = iso.split('-');
  return y && m ? `${y}/${m}` : '';
}

// 有効期限との関係で状態を判定（無期限資格はexpiryが空なので常にok）
function certStatus(rec) {
  if (!rec.expiry) return 'ok';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const exp = new Date(rec.expiry);
  const diffDays = (exp - today) / 86400000;
  if (diffDays < 0) return 'expired';
  if (diffDays <= 90) return 'expiring';
  return 'ok';
}

function switchCertView(id) {
  currentCertView = id;
  document.querySelectorAll('#certViewTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.view === id));
  renderCertMatrix();
}
window.switchCertView = switchCertView;

// 資格保有のドット＋取得日／期限状態／バッジのHTML断片。デスクトップのマトリクスセルとモバイルの縦一覧行の両方から使う
function certCellHTML(rec) {
  if (!rec) return `<span class="skill-dot-empty">・</span>`;
  const status = certStatus(rec);
  const col = status === 'expired' ? 'red' : status === 'expiring' ? 'amber' : 'green';
  const statusLabel = status === 'expired' ? '期限切れ' : status === 'expiring' ? '更新目安' : '';
  const dateText = fmtCertDate(rec.acquired);
  const titleParts = [rec.acquired ? `取得日: ${rec.acquired}` : '', rec.expiry ? `有効期限: ${rec.expiry}` : '', rec.note || ''].filter(Boolean);
  const badgeLinks = (rec.badges || []).map((url, i) => {
    const label = rec.badges.length > 1 ? `🏅バッジ${i + 1}` : '🏅バッジ';
    return `<div class="skill-note"><a href="${esc(url)}" target="_blank" rel="noopener" title="デジタルバッジを開く">${label}</a></div>`;
  }).join('');
  return `<span class="skill-dot" style="background:var(--${col}-dim);color:var(--${col})"${titleParts.length ? ` title="${esc(titleParts.join(' / '))}"` : ''}>✓</span>${dateText ? `<div class="skill-note">${dateText}</div>` : ''}${statusLabel ? `<div class="skill-note" style="color:var(--${col})">${statusLabel}</div>` : ''}${badgeLinks}`;
}

// マトリクスの見出し行（資格・メンバー名）。区分別・分野別でも同じ1つのtableを使い回すため共通化
function certTableHeadHTML() {
  return '<thead><tr><th class="name-col">資格</th>' +
    members.map(m => `<th>${esc(m)}</th>`).join('') +
    '</tr></thead>';
}

// 資格名のリストから、1つのマトリクステーブルに入れるtbody行（資格×メンバー）のHTMLを組み立てる
function certTableRowsHTML(certList) {
  return certList.map(cert => {
    let row = `<tr><td class="name-col">${esc(cert)}</td>`;
    members.forEach(m => {
      row += `<td>${certCellHTML(certByMember[m]?.[cert])}</td>`;
    });
    return row + '</tr>';
  }).join('');
}

// メンバーを1人選んで、その人が保有している資格だけを縦一覧で見るモバイル専用ビュー
function renderMobileCertList(m) {
  const el = document.getElementById('mobileCertList');
  if (!el || !m) return;
  if (!certNames.length) {
    el.innerHTML = `<div style="color:var(--text2);font-size:13px;padding:.5rem 0">登録されている資格がありません</div>`;
    return;
  }
  const held = certNames.filter(c => certByMember[m]?.[c]);
  if (!held.length) {
    el.innerHTML = `<div style="color:var(--text2);font-size:13px;padding:.5rem 0">保有している資格がありません</div>`;
    return;
  }
  el.innerHTML = held.map(c => `<div class="mobile-row"><span class="mobile-row-name">${esc(c)}</span><div class="mobile-row-val">${certCellHTML(certByMember[m][c])}</div></div>`).join('');
}

// 「全体」は資格を1つのマトリクスにまとめて表示。「区分別」「分野別」はNotionで管理している
// 資格区分／資格分野ごとにgroup-sectionへ分けて表示する（区分・分野の値が変わってもコード修正不要）
function renderCertMatrix() {
  const container = document.getElementById('certContainer');
  if (!container) return;

  if (!certNames.length) {
    container.innerHTML = `<div style="color:var(--text2);font-size:13px;padding:1rem 0">登録されている資格がありません</div>`;
    return;
  }

  if (currentCertView === 'all') {
    container.innerHTML = `<div style="overflow-x:auto"><table class="matrix-tbl">${certTableHeadHTML()}<tbody>${certTableRowsHTML(certNames)}</tbody></table></div>`;
    return;
  }

  // 区分別・分野別も同じ1つのtable内でグループ区切り行を挟んで表示する（グループごとに<table>を分けると
  // 資格名の長さに応じて名前列の幅がグループごとにバラつき、列がずれて見えるため）
  const metaKey = currentCertView === 'category' ? 'category' : 'field';
  const groupOrder = [...new Set(certNames.map(c => certMeta[c]?.[metaKey] || '未分類'))];
  const colspan = members.length + 1;
  const body = groupOrder.map((g, i) => {
    const certsInGroup = certNames.filter(c => (certMeta[c]?.[metaKey] || '未分類') === g);
    const col = CAT_PALETTE[i % CAT_PALETTE.length];
    return `<tr class="group-row"><td colspan="${colspan}" style="border-left-color:var(--${col})">
      <span class="g-name" style="color:var(--${col})">${esc(g)}</span><span class="g-count">${certsInGroup.length}件</span>
    </td></tr>${certTableRowsHTML(certsInGroup)}`;
  }).join('');
  container.innerHTML = `<div style="overflow-x:auto"><table class="matrix-tbl">${certTableHeadHTML()}<tbody>${body}</tbody></table></div>`;
}

function showRadar(m) {
  selectedMember = m;
  const data = dataMap();
  const note = document.getElementById('radarNote');
  let labels, vals;

  if (currentGroup === OVERALL_GROUP) {
    // 分野（サブカテゴリ）ごとの平均レベルを軸にした俯瞰表示
    labels = groups.map(g => g.key);
    vals = groups.map(g => {
      const sum = g.items.reduce((acc, s) => acc + (data[m]?.[s.key] || 0), 0);
      return Math.round((sum / g.items.length) * 10) / 10;
    });
    note.textContent = '分野（サブカテゴリ）ごとの平均レベルを表示中。各項目の内訳は分野タブから確認できます。';
  } else {
    const items = (groups.find(g => g.key === currentGroup) || {}).items || skillList;
    labels = items.map(s => skillLabel(s));
    vals = items.map(s => data[m]?.[s.key] || 0);
    note.textContent = '';
  }

  if (radarChart) radarChart.destroy();
  radarChart = new Chart(document.getElementById('radarChart'), {
    type: 'radar',
    data: { labels, datasets: [{ label: m, data: vals, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.12)', borderWidth: 2, pointBackgroundColor: '#3b82f6', pointRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { r: { min: 0, max: 5, ticks: { stepSize: 1, color: '#7f8fa8', backdropColor: 'transparent', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.08)' }, angleLines: { color: 'rgba(255,255,255,0.08)' }, pointLabels: { color: '#7f8fa8', font: { size: 11 } } } },
      plugins: { legend: { display: false } },
    },
  });
}

// メンバー選択は「レーダーチャート」タブのチップと、モバイル専用ビューのチップで共有する。
// どちらで選んでも両方の表示（レーダー・モバイルのスキル一覧・資格一覧）が連動して切り替わる
function selectMember(m) {
  document.querySelectorAll('.member-chip').forEach(c => c.classList.toggle('sel', c.textContent === m));
  showRadar(m);
  renderMobileSkillList(m);
  renderMobileCertList(m);
}
window.selectMember = selectMember;

function buildMemberChips(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  members.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'member-chip' + (i === 0 ? ' sel' : '');
    b.textContent = m;
    b.onclick = () => selectMember(m);
    el.appendChild(b);
  });
}

// initialを渡すと（URLの?member=から呼ばれる想定）その人を初期選択にする。名簿に無い/未指定なら先頭の人
function renderMemberChips(initial) {
  buildMemberChips('memberChips');
  buildMemberChips('mobileMatrixChips');
  if (members.length) selectMember(initial && members.includes(initial) ? initial : members[0]);
}

function filterSkills(q) {
  const el = document.getElementById('searchResult');
  q = q.trim();
  if (!q) { el.innerHTML = ''; return; }
  const matched = skillList.filter(s => s.name.toLowerCase().includes(q.toLowerCase()));
  if (!matched.length) {
    el.innerHTML = `<div style="color:var(--text3);font-size:13px;padding:1rem 0">「${esc(q)}」に一致するスキルが見つかりませんでした</div>`;
    return;
  }
  const data = dataMap();
  const html = matched.map(s => {
    const results = members
      .map(m => ({ m, v: data[m]?.[s.key] || 0 }))
      .filter(r => r.v > 0)
      .sort((a, b) => b.v - a.v);
    if (!results.length) return '';
    return `<div style="margin-bottom:1.25rem">
      <div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:.5rem">${esc(s.name)} <span style="font-size:10px;font-weight:500;color:var(--text2)">(${esc(s.cat)}${s.sub ? ' / ' + esc(s.sub) : ''})</span></div>
      ${results.map(r => {
        const c = levelColor(r.v);
        const note = noteMap[r.m]?.[s.key];
        return `<div class="skill-result">
          <div class="sr-name">${esc(r.m)}</div>
          <div class="sr-bar-wrap"><div class="sr-bar" style="width:${r.v / 5 * 100}%;background:${c.text}"></div></div>
          <div class="sr-lv">Lv.${r.v}</div>
          ${note ? `<div style="flex-basis:100%;font-size:11px;color:var(--text2);margin-top:2px">${esc(note)}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  el.innerHTML = html || `<div style="color:var(--text3);font-size:13px;padding:1rem 0">該当データがありません</div>`;
}
window.filterSkills = filterSkills;

async function init() {
  try {
    const [skillR, memberR, certR] = await Promise.all([
      fetchCSVText('data/skill.csv'),
      fetchCSVText('data/members/member_master.csv'),
      fetchCSVText('data/certifications.csv'),
    ]);
    if (!skillR.ok) throw new Error(`data/skill.csv が見つかりません（HTTP ${skillR.status}）`);
    if (!memberR.ok) throw new Error(`data/members/member_master.csv が見つかりません（HTTP ${memberR.status}）`);
    const rows = Papa.parse(skillR.text, { header: true, skipEmptyLines: true }).data
      .map(r => {
        const skill = (r['スキル名']||'').trim();
        const sub = (r['サブカテゴリ']||'').trim();
        return {
          name:  (r['氏名']||'').trim(),
          skill,
          cat:   (r['カテゴリ']||'').trim(),
          sub,
          // 「その他（自由記入）」等、同名スキルが複数のサブカテゴリに存在するため、スキル名だけでは一意にならない
          key: skill + '||' + sub,
          levels: Object.fromEntries(PERIODS.map(p => [p, +r[p]||0])),
          note:  (r['備考']||'').trim(),
        };
      })
      .filter(r => r.name && r.skill);

    // メンバーの並びはmember_master.csv（＝メンバー一覧の表示順）に固定し、スキルデータの入力状況に左右されない
    const masterOrder = Papa.parse(memberR.text, { header: true, skipEmptyLines: true }).data
      .filter(r => (r['ステータス']||'').trim() === '在籍')
      .map(r => (r['氏名']||'').trim());

    const namesInSkillData = [...new Set(rows.map(r => r.name))];
    members = masterOrder.filter(n => namesInSkillData.includes(n));
    // メンバーマスタに見当たらない名前（表記ゆれ等）は末尾に出現順で残す
    members = members.concat(namesInSkillData.filter(n => !members.includes(n)));

    // 保有資格（任意データ。data/certifications.csvがまだ無い/空でもスキルマップ本体は表示できるようにする）
    certNames = [];
    certByMember = {};
    certMeta = {};
    if (certR.ok) {
      const certRows = Papa.parse(certR.text, { header: true, skipEmptyLines: true }).data
        .map(r => ({
          name: (r['氏名']||'').trim(),
          cert: (r['資格名']||'').trim(),
          category: (r['資格区分']||'').trim(),
          field: (r['資格分野']||'').trim(),
          acquired: (r['資格取得日']||'').trim(),
          expiry: (r['有効期限']||'').trim(),
          badges: (r['デジタルバッジ']||'').split(',').map(s => s.trim()).filter(Boolean),
          note: (r['備考']||'').trim(),
        }))
        .filter(r => r.name && r.cert && r.field !== '研修');
      certNames = [...new Set(certRows.map(r => r.cert))];
      certRows.forEach(r => {
        (certByMember[r.name] ??= {})[r.cert] = { acquired: r.acquired, expiry: r.expiry, badges: r.badges, note: r.note };
        if (!certMeta[r.cert]) certMeta[r.cert] = { category: r.category, field: r.field };
      });
    }

    const skillMap = new Map();
    rows.forEach(r => { if (!skillMap.has(r.key)) skillMap.set(r.key, { key: r.key, name: r.skill, cat: r.cat, sub: r.sub }); });
    skillList = [...skillMap.values()];

    skillNameCounts = {};
    skillList.forEach(s => { skillNameCounts[s.name] = (skillNameCounts[s.name] || 0) + 1; });

    // レーダーチャート用の「分野」グルーピング（サブカテゴリ単位。サブカテゴリが無い場合はカテゴリ単位）
    groups = [];
    const groupMap = new Map();
    skillList.forEach(s => {
      const gKey = s.sub || s.cat || '未分類';
      if (!groupMap.has(gKey)) { const g = { key: gKey, items: [] }; groupMap.set(gKey, g); groups.push(g); }
      groupMap.get(gKey).items.push(s);
    });
    currentGroup = OVERALL_GROUP;

    dataByPeriod = {};
    noteMap = {};
    PERIODS.forEach(p => { dataByPeriod[p] = {}; });
    rows.forEach(r => {
      PERIODS.forEach(p => { (dataByPeriod[p][r.name] ??= {})[r.key] = r.levels[p]; });
      if (r.note) (noteMap[r.name] ??= {})[r.key] = r.note;
    });

    // カテゴリはNotion側の選択肢をそのまま採用し、出現順に色を自動割り当てする。
    categories = [...new Set(rows.map(r => r.cat).filter(Boolean))];
    categories.forEach((c, i) => { catColorMap[c] = CAT_PALETTE[i % CAT_PALETTE.length]; });

    // デフォルト表示は「評価データが1件以上入っている時期」のうち最新のもの。全期未入力なら先頭の時期。
    const periodsWithData = PERIODS.filter(p => rows.some(r => r.levels[p] > 0));
    currentPeriod = periodsWithData.length ? periodsWithData[periodsWithData.length - 1] : PERIODS[0];

    document.getElementById('subtitle').textContent =
      `${new Date().toLocaleDateString('ja-JP')} 時点 ／ 対象 ${members.length}名 ／ 記録スキル ${skillList.length}種`;

    const tabEl = document.getElementById('tabs');
    TABS.forEach(t => {
      tabEl.innerHTML += `<button class="tab${t.id === 'matrix' ? ' active' : ''}" data-id="${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`;
    });

    const periodTabEl = document.getElementById('periodTabs');
    PERIODS.forEach(p => {
      periodTabEl.innerHTML += `<button class="tab${p === currentPeriod ? ' active' : ''}" data-period="${p}" onclick="switchPeriod('${p}')">${p}</button>`;
    });

    // g.keyはNotion側のサブカテゴリ/カテゴリの自由記述値のため、onclick文字列への埋め込み（引用符で壊れる恐れ）を避けて
    // data属性＋イベント委譲で処理する
    const radarGroupEl = document.getElementById('radarGroupTabs');
    radarGroupEl.innerHTML += `<button class="tab${OVERALL_GROUP === currentGroup ? ' active' : ''}" data-group="${OVERALL_GROUP}">総合</button>`;
    groups.forEach(g => {
      radarGroupEl.innerHTML += `<button class="tab${g.key === currentGroup ? ' active' : ''}" data-group="${esc(g.key)}">${esc(g.key)}</button>`;
    });
    radarGroupEl.addEventListener('click', e => {
      const btn = e.target.closest('.tab');
      if (btn) switchRadarGroup(btn.dataset.group);
    });

    const certViewTabEl = document.getElementById('certViewTabs');
    CERT_VIEWS.forEach(v => {
      certViewTabEl.innerHTML += `<button class="tab${v.id === currentCertView ? ' active' : ''}" data-view="${v.id}" onclick="switchCertView('${v.id}')">${v.label}</button>`;
    });

    renderMatrix();
    renderCertMatrix();

    // トップページの「あなたの状況」ウィジェットからの遷移（?member=氏名&tab=radar&group=分野名、または#certifications）を反映する
    const urlParams = new URLSearchParams(location.search);
    renderMemberChips(urlParams.get('member'));
    if (urlParams.get('tab') && TABS.some(t => t.id === urlParams.get('tab'))) switchTab(urlParams.get('tab'));
    const groupParam = urlParams.get('group');
    if (groupParam && groups.some(g => g.key === groupParam)) switchRadarGroup(groupParam);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');

    if (location.hash === '#certifications') {
      document.getElementById('certifications')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-size:13px">⚠ data/skill.csv が読み込めませんでした<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}
init();
</script>
</body>
</html>
