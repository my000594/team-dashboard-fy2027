<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>管理者ツール</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e17">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0e17'/%3E%3Ctext x='50' y='64' font-size='52' text-anchor='middle'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E3%83%A1%E3%83%B3%E3%83%86%E3%83%8A%E3%83%B3%E3%82%B9%E5%88%87%E6%9B%BF%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0e17%22%2C%22theme_color%22%3A%22%230a0e17%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17; --bg2:#111827; --bg3:#1a2235; --bg4:#212d45;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.16);
  --text:#e2e8f4; --text2:#7f8fa8; --text3:#3d4f6a;
  --green:#22c55e; --green-dim:rgba(34,197,94,0.12);
  --red:#f87171; --red-dim:rgba(248,113,113,0.12);
  --blue:#3b82f6; --amber:#f59e0b;
  --font:'Noto Sans JP',sans-serif; --mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:1.5rem;padding-top:max(1.5rem,env(safe-area-inset-top));
  padding-bottom:max(1.5rem,env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:1.25rem}
.app-title{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.status-card{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  padding:1.25rem;text-align:center;
}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
.status-dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
.status-dot.maint{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.status-dot.unknown{background:var(--text3)}
.status-label{font-size:15px;font-weight:700}
.status-sub{font-size:11px;color:var(--text3);margin-top:6px;font-family:var(--mono)}
.toggle-btn{
  width:100%;aspect-ratio:1/1;max-height:220px;border-radius:24px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font);transition:transform .1s, opacity .2s;
}
.toggle-btn:active{transform:scale(.96)}
.toggle-btn.start{background:linear-gradient(160deg,#3a2410,#1a1206);border:1px solid rgba(245,158,11,.35)}
.toggle-btn.stop{background:linear-gradient(160deg,#0f2a1a,#08160e);border:1px solid rgba(34,197,94,.35)}
.toggle-btn:disabled{opacity:.5;cursor:default}
.toggle-icon{font-size:40px}
.toggle-text{font-size:16px;font-weight:700}
.toggle-text.start{color:var(--amber)}
.toggle-text.stop{color:var(--green)}
.toggle-sub{font-size:11px;color:var(--text3)}
.msg{width:100%;font-size:12px;text-align:center;padding:.6rem;border-radius:10px;min-height:1px}
.msg.info{background:var(--bg3);color:var(--text2)}
.msg.error{background:var(--red-dim);color:var(--red)}
.msg.ok{background:var(--green-dim);color:var(--green)}
.settings-toggle{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:.5rem;font-family:var(--font)}
.settings-panel{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:1rem;display:none;flex-direction:column;gap:8px;
}
.settings-panel.open{display:flex}
.settings-panel label{font-size:11px;color:var(--text2)}
.settings-panel input,.settings-panel textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;
  padding:.6rem .7rem;color:var(--text);font-size:13px;font-family:var(--mono);outline:none;
}
.settings-panel textarea{font-family:var(--font);resize:vertical;min-height:50px}
.settings-row{display:flex;gap:8px}
.settings-row button{
  flex:1;padding:.55rem;border-radius:8px;border:.5px solid var(--border2);background:var(--bg3);
  color:var(--text2);font-size:12px;font-family:var(--font);cursor:pointer;
}
.settings-row button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);
  z-index:100;align-items:center;justify-content:center;padding:1.5rem;
}
.confirm-overlay.open{display:flex}
.confirm-card{
  width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--border2);
  border-radius:18px;padding:1.5rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.confirm-icon{font-size:34px}
.confirm-title{font-size:16px;font-weight:700}
.confirm-body{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:.5rem}
.confirm-row{display:flex;gap:10px;width:100%;margin-top:.25rem}
.confirm-btn{flex:1;padding:.75rem;border-radius:10px;border:none;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer}
.confirm-btn.cancel{background:var(--bg3);color:var(--text2);border:.5px solid var(--border2)}
.confirm-btn.ok.start{background:var(--amber);color:#1a1206}
.confirm-btn.ok.stop{background:var(--green);color:#08160e}
.confirm-btn.ok.sync{background:var(--blue);color:#0a1526}
.section-divider{width:100%;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.03em;padding-top:.75rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px}
.sync-desc{width:100%;font-size:11px;color:var(--text3);line-height:1.5;margin-top:-.5rem}
.sync-btn{
  width:100%;padding:1rem;border-radius:16px;cursor:pointer;
  background:linear-gradient(160deg,#0f1f3a,#081020);border:1px solid rgba(59,130,246,.35);color:var(--blue);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font);font-size:15px;font-weight:700;transition:transform .1s, opacity .2s;
}
.sync-btn:active{transform:scale(.97)}
.sync-btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-title">🛠️ 管理者ツール <span style="color:var(--text3);font-weight:400">／ 第1ライン Dashboard</span></div>

  <div class="status-card">
    <div id="statusLabel" class="status-label"><span class="status-dot unknown"></span>確認中...</div>
    <div id="statusSub" class="status-sub">&nbsp;</div>
  </div>

  <button id="toggleBtn" class="toggle-btn start" disabled>
    <span class="toggle-icon">⏳</span>
    <span class="toggle-text">読み込み中</span>
  </button>

  <div id="msg" class="msg" style="display:none"></div>

  <div class="section-divider">📥 Notion同期</div>
  <div class="sync-desc">Notion上の最新データを取得し、data/配下のCSVを再生成します（通常は毎日6:00 JSTに自動実行されるので、急ぎ反映したい時だけ使用）</div>
  <button id="syncBtn" class="sync-btn">
    <span class="sync-icon">🔄</span>
    <span class="sync-text">今すぐNotion同期を実行</span>
  </button>
  <div id="syncMsg" class="msg" style="display:none"></div>
  <div id="syncLastStatus" class="sync-desc" style="margin-top:-.5rem">前回の同期：確認中...</div>

  <button id="settingsToggle" class="settings-toggle">⚙ 詳細設定・トークン設定</button>

  <div id="settingsPanel" class="settings-panel">
    <label>GitHub Personal Access Token（このリポジトリのActions権限のみのfine-grained推奨）</label>
    <input type="password" id="tokenInput" placeholder="github_pat_...">
    <label>表示メッセージ（開始時のみ・空欄で前回内容を維持）</label>
    <textarea id="msgInput" placeholder="データ更新のため一時停止しています"></textarea>
    <label>復旧見込み（開始時のみ・空欄で前回内容を維持）</label>
    <input type="text" id="estInput" placeholder="本日中に復旧予定">
    <div class="settings-row">
      <button id="saveBtn" class="primary">保存</button>
      <button id="clearBtn">トークン削除</button>
    </div>
  </div>
</div>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-card">
    <div id="confirmIcon" class="confirm-icon"></div>
    <div id="confirmTitle" class="confirm-title"></div>
    <div id="confirmBody" class="confirm-body"></div>
    <div class="confirm-row">
      <button id="confirmCancel" class="confirm-btn cancel">キャンセル</button>
      <button id="confirmOk" class="confirm-btn ok"></button>
    </div>
  </div>
</div>

<script>
const OWNER = 'my000594';
const REPO = 'team-dashboard-fy2027';
const WORKFLOW_FILE = 'maintenance.yml';
const SYNC_WORKFLOW_FILE = 'sync-notion.yml';
const TOKEN_KEY = 'maint_app_gh_pat';

const el = id => document.getElementById(id);
const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
const setToken = t => localStorage.setItem(TOKEN_KEY, t);
const clearToken = () => localStorage.removeItem(TOKEN_KEY);

let currentActive = null; // true=メンテナンス中 / false=稼働中 / null=不明
let busy = false;

function showMsg(text, type) {
  const m = el('msg');
  m.textContent = text;
  m.className = 'msg' + (type ? ' ' + type : '');
  m.style.display = text ? 'block' : 'none';
}

function renderStatus(active, message) {
  currentActive = active;
  const label = el('statusLabel');
  const sub = el('statusSub');
  const btn = el('toggleBtn');

  if (active === null) {
    label.innerHTML = `<span class="status-dot unknown"></span>状態を取得できませんでした`;
    sub.textContent = '';
    btn.className = 'toggle-btn start';
    btn.innerHTML = `<span class="toggle-icon">⚠️</span><span class="toggle-text">再読み込み</span>`;
    btn.disabled = false;
    btn.onclick = () => location.reload();
    return;
  }

  if (active) {
    label.innerHTML = `<span class="status-dot maint"></span>メンテナンス中`;
    sub.textContent = message || '';
    btn.className = 'toggle-btn stop';
    btn.innerHTML = `<span class="toggle-icon">✅</span><span class="toggle-text stop">メンテナンスを解除</span><span class="toggle-sub">タップして公開を再開</span>`;
  } else {
    label.innerHTML = `<span class="status-dot live"></span>公開中（稼働中）`;
    sub.textContent = '部下からダッシュボードが見えています';
    btn.className = 'toggle-btn start';
    btn.innerHTML = `<span class="toggle-icon">🔧</span><span class="toggle-text start">メンテナンスを開始</span><span class="toggle-sub">タップして一時停止</span>`;
  }
  btn.disabled = false;
  btn.onclick = () => confirmToggle(!active);
}

// 誤タップで即座に切り替わらないよう、実行前に必ず確認画面を挟む（開始・解除どちらも）
function confirmToggle(nextActive) {
  const overlay = el('confirmOverlay');
  const okBtn = el('confirmOk');

  if (nextActive) {
    el('confirmIcon').textContent = '🔧';
    el('confirmTitle').textContent = 'メンテナンスを開始しますか？';
    el('confirmBody').textContent = '部下からダッシュボードが見えなくなり、メンテナンス画面に切り替わります。';
    okBtn.className = 'confirm-btn ok start';
    okBtn.textContent = '開始する';
  } else {
    el('confirmIcon').textContent = '✅';
    el('confirmTitle').textContent = 'メンテナンスを解除しますか？';
    el('confirmBody').textContent = 'ダッシュボードが再び部下に公開されます。';
    okBtn.className = 'confirm-btn ok stop';
    okBtn.textContent = '解除する';
  }

  overlay.classList.add('open');
  el('confirmCancel').onclick = () => overlay.classList.remove('open');
  okBtn.onclick = () => {
    overlay.classList.remove('open');
    toggle(nextActive);
  };
}

async function fetchStatus() {
  try {
    const res = await fetch('data/maintenance.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderStatus(!!data.active, data.message);
  } catch (e) {
    renderStatus(null);
  }
}

async function toggle(nextActive) {
  if (busy) return;
  const token = getToken();
  if (!token) {
    showMsg('先に「⚙ 詳細設定・トークン設定」からトークンを設定してください', 'error');
    el('settingsPanel').classList.add('open');
    return;
  }
  busy = true;
  const btn = el('toggleBtn');
  btn.disabled = true;
  el('syncBtn').disabled = true;
  btn.innerHTML = `<span class="spinner"></span><span class="toggle-text">送信中...</span>`;
  showMsg('GitHub Actionsに送信しています...', 'info');

  const inputs = { mode: nextActive ? 'on' : 'off' };
  if (nextActive) {
    const msgVal = el('msgInput').value.trim();
    const estVal = el('estInput').value.trim();
    if (msgVal) inputs.message = msgVal;
    if (estVal) inputs.estimated = estVal;
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ ref: 'main', inputs }),
    });

    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).message || ''; } catch (e) { /* ignore */ }
      if (res.status === 401) throw new Error(`トークンが無効です（⚙から再設定してください）${detail ? ' / ' + detail : ''}`);
      if (res.status === 403) throw new Error(`権限不足です（Actions:write権限・対象リポジトリの選択を確認）${detail ? ' / ' + detail : ''}`);
      if (res.status === 404) throw new Error(`ワークフローが見つかりません（リポジトリ名・ファイル名を確認）${detail ? ' / ' + detail : ''}`);
      throw new Error(`GitHub API エラー（HTTP ${res.status}）${detail ? ' / ' + detail : ''}`);
    }

    showMsg('送信しました。反映まで数十秒お待ちください...', 'info');
    await waitForReflect(nextActive);
  } catch (e) {
    showMsg(e.message, 'error');
    busy = false;
    el('syncBtn').disabled = false;
    fetchStatus();
  }
}

async function waitForReflect(expectedActive) {
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const res = await fetch('data/maintenance.json?t=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      if (!!data.active === expectedActive) {
        showMsg('反映されました', 'ok');
        renderStatus(!!data.active, data.message);
        busy = false;
        el('syncBtn').disabled = false;
        return;
      }
    } catch (e) { /* retry */ }
  }
  showMsg('反映確認がタイムアウトしました。GitHub Actionsの実行状況を確認してください', 'error');
  busy = false;
  el('syncBtn').disabled = false;
  fetchStatus();
}

async function ghApi(path, token) {
  const res = await fetch(`https://api.github.com${path}`, {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function showSyncMsg(text, type) {
  const m = el('syncMsg');
  m.textContent = text;
  m.className = 'msg' + (type ? ' ' + type : '');
  m.style.display = text ? 'block' : 'none';
}

// 追跡中のdispatchが残っていれば「同期状況を再確認」ボタンに、無ければ通常の実行ボタンに戻す。
// 実行中にバックグラウンドへ回してタイムアウト表示が出た後も、このボタンでその場から手動再確認できるようにする
// （GitHub Actionsのタブを開きに行かなくても状況を追えるようにするための導線）
function resetSyncBtn() {
  busy = false;
  const toggleBtn = el('toggleBtn');
  if (toggleBtn) toggleBtn.disabled = false;
  renderSyncButtonState();
}

function renderSyncButtonState() {
  const btn = el('syncBtn');
  btn.disabled = false;
  const pending = getSyncPending();
  if (pending && Date.now() - pending.dispatchedAt <= SYNC_STALE_MS) {
    btn.innerHTML = `<span class="sync-icon">🔎</span><span class="sync-text">同期状況を再確認</span>`;
    btn.onclick = () => resumeSyncIfPending();
  } else {
    btn.innerHTML = `<span class="sync-icon">🔄</span><span class="sync-text">今すぐNotion同期を実行</span>`;
    btn.onclick = confirmSync;
  }
}

// メンテナンス切替と同じく、誤タップで即実行されないよう確認画面を挟む。
// 公開状態には影響しない操作だが、押してすぐ動く導線自体が誤操作の入口になるため、開始/解除と足並みを揃えた
function confirmSync() {
  const overlay = el('confirmOverlay');
  const okBtn = el('confirmOk');

  el('confirmIcon').textContent = '🔄';
  el('confirmTitle').textContent = '今すぐNotion同期を実行しますか？';
  el('confirmBody').textContent = 'Notion側の最新データでdata/配下のCSVが再生成されます。部下への公開状態には影響しません。';
  okBtn.className = 'confirm-btn ok sync';
  okBtn.textContent = '実行する';

  overlay.classList.add('open');
  el('confirmCancel').onclick = () => overlay.classList.remove('open');
  okBtn.onclick = () => {
    overlay.classList.remove('open');
    runSync();
  };
}

const SYNC_PENDING_KEY = 'sync_app_pending';
const SYNC_STALE_MS = 20 * 60 * 1000; // 20分以上前のdispatchは追跡を諦める（放棄扱い）
const SYNC_LAST_KEY = 'sync_last_result'; // 直近の同期結果（GitHub Actionsを開かずに確認できるようにするためのキャッシュ）

function getSyncPending() {
  try { return JSON.parse(localStorage.getItem(SYNC_PENDING_KEY) || 'null'); }
  catch (e) { return null; }
}
function setSyncPending(obj) {
  try { localStorage.setItem(SYNC_PENDING_KEY, JSON.stringify(obj)); } catch (e) { /* 容量超過等は無視 */ }
  renderSyncButtonState();
}
function clearSyncPending() {
  localStorage.removeItem(SYNC_PENDING_KEY);
  renderSyncButtonState();
}

// 「前回の同期」表示。実行中のdispatchを自分が追跡できているかどうかに関係なく、GitHub側の最新の
// 完了済みrunを直接問い合わせて表示する。これが「GitHub Actionsのタブを見に行かなくても確認できる」手段になる
function fmtSyncTime(iso) {
  return new Date(iso).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function renderLastSyncStatus(text) {
  const elx = el('syncLastStatus');
  if (elx) elx.textContent = '前回の同期：' + text;
}
function cacheLastSyncResult(conclusion, finishedAt) {
  try { localStorage.setItem(SYNC_LAST_KEY, JSON.stringify({ conclusion, finishedAt })); } catch (e) { /* ignore */ }
}
async function refreshLastSyncStatus() {
  const token = getToken();
  if (!token) { renderLastSyncStatus('トークン未設定のため確認できません'); return; }
  try {
    const data = await ghApi(`/repos/${OWNER}/${REPO}/actions/workflows/${SYNC_WORKFLOW_FILE}/runs?status=completed&per_page=1`, token);
    const run = (data.workflow_runs || [])[0];
    if (!run) { renderLastSyncStatus('実行履歴がありません'); return; }
    cacheLastSyncResult(run.conclusion, run.updated_at);
    const icon = run.conclusion === 'success' ? '✅' : '⚠️';
    renderLastSyncStatus(`${icon} ${run.conclusion === 'success' ? '成功' : '失敗/一部失敗'}（${fmtSyncTime(run.updated_at)}・毎日6:00 JST自動実行含む）`);
  } catch (e) {
    // キャッシュがあればそれだけでも出す（オフライン・トークン失効直後など）
    try {
      const cached = JSON.parse(localStorage.getItem(SYNC_LAST_KEY) || 'null');
      if (cached) {
        const icon = cached.conclusion === 'success' ? '✅' : '⚠️';
        renderLastSyncStatus(`${icon}（前回確認時点・最新は未取得）${fmtSyncTime(cached.finishedAt)}`);
        return;
      }
    } catch (e2) { /* ignore */ }
    renderLastSyncStatus('取得できませんでした');
  }
}

function renderSyncBusy(text) {
  busy = true;
  const btn = el('syncBtn');
  btn.disabled = true;
  el('toggleBtn').disabled = true;
  btn.innerHTML = `<span class="spinner"></span><span>${text}</span>`;
}

// dispatchedAt以降に作られたworkflow_dispatch起点のrunのうち最も古いものを「自分のrun」とみなす。
// sync-notion.ymlはconcurrencyグループで同時実行を1つに制限しているため、直後に増えたrunは
// ほぼ確実に自分がキューに入れたものになる（15秒のクロックずれ許容つき）
async function findRunSince(dispatchedAtMs, token) {
  const data = await ghApi(`/repos/${OWNER}/${REPO}/actions/workflows/${SYNC_WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=10`, token);
  const candidates = (data.workflow_runs || [])
    .filter(r => new Date(r.created_at).getTime() >= dispatchedAtMs - 15000)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  return candidates[0] || null;
}

async function runSync() {
  if (busy) return;
  const token = getToken();
  if (!token) {
    showSyncMsg('先に「⚙ 詳細設定・トークン設定」からトークンを設定してください', 'error');
    el('settingsPanel').classList.add('open');
    return;
  }
  const dispatchedAt = Date.now();
  renderSyncBusy('送信中...');
  showSyncMsg('GitHub Actionsに送信しています...', 'info');

  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${SYNC_WORKFLOW_FILE}/dispatches`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ ref: 'main' }),
    });

    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).message || ''; } catch (e) { /* ignore */ }
      if (res.status === 401) throw new Error(`トークンが無効です（⚙から再設定してください）${detail ? ' / ' + detail : ''}`);
      if (res.status === 403) throw new Error(`権限不足です（Actions:write権限・対象リポジトリの選択を確認）${detail ? ' / ' + detail : ''}`);
      if (res.status === 404) throw new Error(`ワークフローが見つかりません（リポジトリ名・ファイル名を確認）${detail ? ' / ' + detail : ''}`);
      throw new Error(`GitHub API エラー（HTTP ${res.status}）${detail ? ' / ' + detail : ''}`);
    }

    // dispatch自体はこの時点で受理済み＝送信は成功が確定している。以降は実行状況の「確認」であり、
    // ここから先タイムアウトしても「送信に失敗した」わけではない
    setSyncPending({ dispatchedAt, runId: null });
    await trackSync({ dispatchedAt, runId: null }, token);
  } catch (e) {
    showSyncMsg(e.message, 'error');
    resetSyncBtn();
  }
}

// スマホでアプリをバックグラウンドに回す・閉じるとJSの実行自体が止まり、ポーリングが
// 続行できないことがある。進捗をlocalStorageに逐次保存し、アプリを開き直した時（init）や
// タブが再度前面に来た時（visibilitychange）に、保存済みの状態から確認を再開できるようにしている。
// これにより「実行が続いているのに毎回GitHub Actionsタブを見に行かされる」状態を避ける。
//
// 待ち時間の目安：sync-notion.ymlはconcurrencyグループで同時実行を1つに制限しているため、
// 前の実行（毎日6:00 JSTの自動実行や、直前の手動実行）がまだ動いていると新しいrunはキューで
// 待たされる。加えてNotion API不調時は30秒間隔で最大3回リトライする。これらが重なると数分かかる
// ことがあるため、検出90秒・完了確認10分というかなり余裕を持たせた時間で待つ
// （2026-08-09：以前は検出60秒・完了確認2分で、実際には成功しているのに時間切れ表示が出ていたため延長）
async function trackSync(pending, token) {
  let { dispatchedAt, runId } = pending;
  showSyncMsg(runId ? '実行状況を確認しています...' : '実行を検出しています...', 'info');
  renderSyncBusy(runId ? '確認中...' : '実行を検出中...');

  if (!runId) {
    for (let i = 0; i < 30 && !runId; i++) {
      try {
        const run = await findRunSince(dispatchedAt, token);
        if (run) runId = run.id;
      } catch (e) { /* retry */ }
      if (!runId) await new Promise(r => setTimeout(r, 3000));
    }
    if (!runId) {
      // 送信自体は成功しているため「失敗した」とは案内しない。pendingは消さずに残し、
      // 次回このアプリを開いた時・前面に戻した時、または下のボタンから手動で確認を再開できる
      showSyncMsg('送信は完了していますが、実行の検出に時間がかかっています。下のボタンから再確認するか、少ししてからこのアプリを開き直してください', 'error');
      resetSyncBtn();
      return;
    }
    setSyncPending({ dispatchedAt, runId });
  }

  const COMPLETION_TRIES = 120; // 5秒間隔 × 120回 ＝ 最大10分待つ
  for (let i = 0; i < COMPLETION_TRIES; i++) {
    try {
      const data = await ghApi(`/repos/${OWNER}/${REPO}/actions/runs/${runId}`, token);
      if (data.status === 'completed') {
        clearSyncPending();
        cacheLastSyncResult(data.conclusion, data.updated_at);
        if (data.conclusion === 'success') {
          renderLastSyncStatus(`✅ 成功（${fmtSyncTime(data.updated_at)}）`);
          showSyncMsg('同期が完了しました', 'ok');
        } else {
          renderLastSyncStatus(`⚠️ 失敗/一部失敗（${fmtSyncTime(data.updated_at)}）`);
          showSyncMsg('一部失敗した可能性があります（成功したデータベース分は反映済み）。詳細はGitHub Actionsのログを確認してください', 'error');
        }
        resetSyncBtn();
        return;
      }
      const elapsedMin = Math.round((i * 5) / 60 * 10) / 10;
      renderSyncBusy(`実行中...（${data.status === 'in_progress' ? '処理中' : 'キュー待ち'}・約${elapsedMin}分経過）`);
    } catch (e) { /* retry */ }
    await new Promise(r => setTimeout(r, 5000));
  }
  // ここでもpendingは消さない。実際にはバックグラウンドで動いている可能性が高いため、
  // 開き直した時・前面に戻した時、または下のボタンから手動で再確認させる
  showSyncMsg('実行確認に時間がかかっています。下のボタンから再確認するか、少ししてからこのアプリを開き直してください', 'error');
  resetSyncBtn();
}

// アプリを開いた時／再度前面に表示された時、または「同期状況を再確認」ボタンから、
// 追跡中の同期があれば確認を再開する
async function resumeSyncIfPending() {
  if (busy) return;
  const pending = getSyncPending();
  if (!pending) return;
  if (Date.now() - pending.dispatchedAt > SYNC_STALE_MS) {
    clearSyncPending();
    return;
  }
  const token = getToken();
  if (!token) {
    showSyncMsg('先に「⚙ 詳細設定・トークン設定」からトークンを設定してください', 'error');
    el('settingsPanel').classList.add('open');
    return;
  }
  await trackSync(pending, token);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { resumeSyncIfPending(); refreshLastSyncStatus(); }
});

renderSyncButtonState();

// 設定パネル
el('settingsToggle').onclick = () => el('settingsPanel').classList.toggle('open');
el('tokenInput').value = getToken();
el('saveBtn').onclick = () => {
  const t = el('tokenInput').value.trim();
  if (t) { setToken(t); showMsg('トークンを保存しました', 'ok'); }
  el('settingsPanel').classList.remove('open');
};
el('clearBtn').onclick = () => {
  clearToken();
  el('tokenInput').value = '';
  showMsg('トークンを削除しました', 'info');
};

fetchStatus();
resumeSyncIfPending();

// 「前回の同期」はキャッシュがあれば即座に表示し、その裏でGitHubへ最新状況を問い合わせて上書きする
(() => {
  try {
    const cached = JSON.parse(localStorage.getItem(SYNC_LAST_KEY) || 'null');
    if (cached) {
      const icon = cached.conclusion === 'success' ? '✅' : '⚠️';
      renderLastSyncStatus(`${icon} ${cached.conclusion === 'success' ? '成功' : '失敗/一部失敗'}（${fmtSyncTime(cached.finishedAt)}）`);
    }
  } catch (e) { /* ignore */ }
})();
refreshLastSyncStatus();
</script>
</body>
</html>
