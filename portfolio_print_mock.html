<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スキルポートフォリオ 印刷プレビュー（モック）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#dde3ea;padding:32px 24px;min-height:100vh;color:#111827}

/* 操作UI（画面のみ） */
.screen-ui{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.btn{border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.btn-print{background:#1d4ed8;color:#fff}
.btn-print:hover{background:#1e40af}
.mock-note{font-size:11px;color:#6b7280;background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:7px 10px;max-width:180px;line-height:1.5;text-align:center}

/* A4 paper */
.paper{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:16mm 18mm 14mm;box-shadow:0 6px 32px rgba(0,0,0,.14)}

/* Header */
.pf-header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px;border-bottom:2.5px solid #1d4ed8;margin-bottom:18px}
.pf-doc-type{font-size:9.5px;color:#9ca3af;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.pf-name{font-size:28px;font-weight:700;letter-spacing:-.02em;color:#0f172a}
.pf-right{text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pf-company{font-size:11px;color:#374151;line-height:1.6}
.pf-date{font-size:9.5px;color:#9ca3af}

/* Section titles */
.sec{font-size:8.5px;font-weight:700;color:#9ca3af;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:.5px;background:#e5e7eb}

/* Two-column */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;align-items:start}

/* Radar */
.radar-wrap{width:100%;aspect-ratio:1;max-width:240px;margin:0 auto;display:block}

/* Strengths */
.sitem{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid #f3f4f6}
.sitem:last-child{border-bottom:none}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.slabel{flex:1;min-width:0}
.sname{font-size:11px;color:#1f2937;line-height:1.3;font-weight:500}
.ssub{font-size:9px;color:#9ca3af;margin-top:1px}
.sbar-bg{width:52px;height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden;flex-shrink:0}
.sbar-fill{height:100%;border-radius:3px}
.slv{font-size:10px;color:#6b7280;width:14px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* Domain bars */
.drow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dlabel{font-size:10px;color:#374151;width:116px;flex-shrink:0;line-height:1.3}
.dbar-bg{flex:1;height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden}
.dbar-fill{height:100%;border-radius:3px}
.davg{font-size:10px;color:#9ca3af;width:22px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.dmax{font-size:8.5px;color:#d1d5db;flex-shrink:0}

/* Certifications */
.citem{display:flex;gap:10px;padding:7px 0;border-bottom:.5px solid #f3f4f6}
.citem:last-child{border-bottom:none}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.cname{font-size:11.5px;font-weight:600;color:#111827;margin-bottom:3px}
.cmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ckind{font-size:8.5px;background:#f3f4f6;color:#6b7280;padding:1px 6px;border-radius:3px}
.cyear{font-size:9.5px;color:#9ca3af}

/* Footer */
.pf-footer{margin-top:20px;padding-top:8px;border-top:.5px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.pf-footer-note{font-size:8.5px;color:#d1d5db}
.lv-guide{display:flex;gap:10px;font-size:8px;color:#9ca3af}
.lv-guide span{display:flex;align-items:center;gap:3px}

@media print{
  body{background:none;padding:0}
  .screen-ui{display:none}
  .paper{box-shadow:none;width:100%;padding:12mm 14mm}
}
</style>
</head>
<body>

<div class="screen-ui">
  <button class="btn btn-print" onclick="window.print()">🖨 印刷</button>
  <div class="mock-note">※ サンプルデータ（米花 雅史）<br>実際のCSVデータは使用していません</div>
</div>

<div class="paper">

  <!-- Header -->
  <div class="pf-header">
    <div>
      <div class="pf-doc-type">Skill Portfolio</div>
      <div class="pf-name">米花 雅史</div>
    </div>
    <div class="pf-right">
      <div class="pf-company">SYSホールディングス<br>社会情報インフラ部</div>
      <div class="pf-date" id="issueDate"></div>
    </div>
  </div>

  <!-- Radar + Strengths -->
  <div class="two-col">
    <div>
      <div class="sec">分野別スキル</div>
      <svg class="radar-wrap" id="radarSvg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div>
      <div class="sec">得意スキル（Lv.4以上）</div>
      <div id="strengths"></div>
    </div>
  </div>

  <!-- Domain bars -->
  <div class="sec" style="margin-top:2px">分野別スキル分布（平均レベル）</div>
  <div id="domainBars" style="margin-bottom:14px"></div>

  <!-- Certifications -->
  <div class="sec">保有資格</div>
  <div id="certList"></div>

  <!-- Footer -->
  <div class="pf-footer">
    <div class="lv-guide">
      <span>スキルレベル：</span>
      <span>1 知っている</span><span>2 触ったことがある</span><span>3 業務で使える</span><span>4 得意</span><span>5 エキスパート</span>
    </div>
    <div class="pf-footer-note" id="footerDate"></div>
  </div>
</div>

<script>
// ── サンプルデータ（米花 雅史 イメージ値） ──
const RADAR = [
  { short: 'ビジネス',   label: 'ビジネススキル',       avg: 4.6 },
  { short: '提案・顧客', label: '提案・顧客対応',       avg: 4.8 },
  { short: 'PJ管理',     label: 'プロジェクト管理',     avg: 4.5 },
  { short: '開発・品質', label: '開発工程・品質',       avg: 3.2 },
  { short: 'セキュリティ',label:'セキュリティ',         avg: 2.5 },
  { short: 'クラウド',   label: 'クラウド・インフラ',   avg: 2.0 },
  { short: 'アプリ開発', label: 'アプリケーション開発', avg: 2.0 },
  { short: 'PG言語',     label: 'プログラミング言語',   avg: 1.8 },
  { short: 'AI・データ', label: 'AI・データ',           avg: 1.5 },
];

const STRENGTHS = [
  { name: '顧客折衝・プレゼンテーション', subcat: '提案・顧客対応',   lv: 5 },
  { name: '戦略立案・意思決定',           subcat: 'ビジネススキル',    lv: 5 },
  { name: 'リスク・課題管理',             subcat: 'プロジェクト管理',  lv: 4 },
  { name: 'スコープ・WBS管理',            subcat: 'プロジェクト管理',  lv: 4 },
  { name: '要件定義・提案書作成',         subcat: '提案・顧客対応',    lv: 4 },
];

const CERTS = [
  { name: '応用情報技術者',                              kind: '国家資格',  year: '2010', exp: null        },
  { name: 'PMP（Project Management Professional）',      kind: '認定資格',  year: '2018', exp: '2027-01-31'},
  { name: 'AWS Certified Solutions Architect – Associate',kind: '認定資格', year: '2023', exp: '2026-11-15'},
];

// ── 日付 ──
const today = new Date();
const ds = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
document.getElementById('issueDate').textContent = ds + ' 現在';
document.getElementById('footerDate').textContent = ds + ' 出力';

// ── レーダー SVG ──
function drawRadar() {
  const svg = document.getElementById('radarSvg');
  const ns  = 'http://www.w3.org/2000/svg';
  const cx = 150, cy = 150, maxR = 88, labelR = 114;
  const n = RADAR.length;

  const angle = i => (i / n) * 2 * Math.PI - Math.PI / 2;
  const pt    = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  const pstr  = pts => pts.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const el    = (tag, attrs={}, text='') => {
    const e = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
    if (text) e.textContent = text;
    return e;
  };

  // グリッド
  [.2, .4, .6, .8, 1].forEach(f => {
    svg.appendChild(el('polygon', {
      points: pstr(RADAR.map((_,i)=>pt(i,maxR*f))),
      fill: 'none', stroke: f===1?'#d1d5db':'#e5e7eb', 'stroke-width': f===1?1:0.5
    }));
  });

  // 軸線
  RADAR.forEach((_,i) => {
    const [x,y] = pt(i, maxR);
    svg.appendChild(el('line',{x1:cx,y1:cy,x2:x.toFixed(1),y2:y.toFixed(1),stroke:'#e5e7eb','stroke-width':.5}));
  });

  // データ多角形
  svg.appendChild(el('polygon',{
    points: pstr(RADAR.map((d,i)=>pt(i,maxR*d.avg/5))),
    fill:'rgba(29,78,216,.13)', stroke:'#1d4ed8', 'stroke-width':1.8
  }));

  // ドット
  RADAR.forEach((d,i) => {
    const [x,y] = pt(i, maxR*d.avg/5);
    svg.appendChild(el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:2.8,fill:'#1d4ed8'}));
  });

  // ラベル
  RADAR.forEach((d,i) => {
    const ang = angle(i);
    const [x,y] = [cx + labelR * Math.cos(ang), cy + labelR * Math.sin(ang)];
    const t = el('text',{
      x: x.toFixed(1), y: y.toFixed(1),
      'text-anchor':'middle','dominant-baseline':'middle',
      'font-size':'8','fill':'#6b7280','font-family':'Noto Sans JP, sans-serif'
    }, d.short);
    svg.appendChild(t);
  });
}

// ── 強みスキル ──
const col = lv => lv >= 5 ? '#059669' : '#1d4ed8';
const sEl = document.getElementById('strengths');
STRENGTHS.forEach(s => {
  const d = document.createElement('div');
  d.className = 'sitem';
  d.innerHTML = `
    <div class="sdot" style="background:${col(s.lv)}"></div>
    <div class="slabel">
      <div class="sname">${s.name}</div>
      <div class="ssub">${s.subcat}</div>
    </div>
    <div class="sbar-bg"><div class="sbar-fill" style="width:${s.lv/5*100}%;background:${col(s.lv)}"></div></div>
    <div class="slv">${s.lv}</div>`;
  sEl.appendChild(d);
});

// ── 分野別バー ──
const domainCol = avg => avg>=4?'#059669':avg>=3?'#1d4ed8':avg>=2?'#0891b2':avg>=1?'#d97706':'#dc2626';
const dEl = document.getElementById('domainBars');
[...RADAR].sort((a,b)=>b.avg-a.avg).forEach(d => {
  const r = document.createElement('div');
  r.className = 'drow';
  r.innerHTML = `
    <div class="dlabel">${d.label}</div>
    <div class="dbar-bg"><div class="dbar-fill" style="width:${d.avg/5*100}%;background:${domainCol(d.avg)}"></div></div>
    <div class="davg">${d.avg.toFixed(1)}</div>
    <div class="dmax">/ 5</div>`;
  dEl.appendChild(r);
});

// ── 資格 ──
const expiryTag = exp => {
  if (!exp) return '';
  const days = Math.floor((new Date(exp)-new Date())/86400000);
  if (days<0)   return `<span style="font-size:8.5px;color:#dc2626;background:#fee2e2;padding:1px 6px;border-radius:3px">期限切れ</span>`;
  if (days<=90) return `<span style="font-size:8.5px;color:#d97706;background:#fef3c7;padding:1px 6px;border-radius:3px">更新目安 ${exp}</span>`;
  return `<span style="font-size:8.5px;color:#059669;background:#d1fae5;padding:1px 6px;border-radius:3px">有効期限 ${exp}</span>`;
};
const cEl = document.getElementById('certList');
CERTS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'citem';
  d.innerHTML = `
    <div class="cdot" style="background:${c.kind==='国家資格'?'#1d4ed8':'#7c3aed'}"></div>
    <div>
      <div class="cname">${c.name}</div>
      <div class="cmeta">
        <span class="ckind">${c.kind}</span>
        <span class="cyear">取得 ${c.year}年</span>
        ${expiryTag(c.exp)}
      </div>
    </div>`;
  cEl.appendChild(d);
});

drawRadar();
</script>
</body>
</html>
