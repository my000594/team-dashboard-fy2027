<style>
.summary-card {
  display: flex; flex-direction: column;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 1.25rem;
  text-decoration: none; color: inherit;
  transition: border-color .2s, background .2s;
}
.summary-card:hover { border-color: var(--border2); background: var(--bg3); }
.summary-card-icon { font-size: 20px; margin-bottom: .6rem; }
.summary-card-title { font-size: 14px; font-weight: 700; margin-bottom: .3rem; }
.summary-card-desc { font-size: 12px; color: var(--text2); line-height: 1.6; flex: 1; }
.summary-card-footer { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }
.summary-stat { font-family: var(--mono); font-size: 20px; font-weight: 700; }
.summary-stat-label { font-size: 11px; color: var(--text3); margin-top: 1px; }

/* ── 「あなたの状況」ウィジェット ──────────────────────────
   ページ見出しと同じ行の右側に配置。名前ブロック・各指標（3SEレポート提出件数／得意スキル／保有資格）は
   幅を固定しており、選ぶ人によってウィジェット全体の横幅が変動しない。各指標は関連ページへのリンクになっている。
   ラベルを上段・値＋補足を下段に分けているのは、1行にまとめると値がラベルの続きとして詰め込まれて
   変な位置で折り返るため（値の行に列の全幅を使わせる）。
   ────────────────────────────────────────────────── */
.you-mini{ position:relative }
@media (max-width:560px){ .you-mini{ width:100% } }
.you-mini-card{
  display:flex; align-items:center; flex-wrap:nowrap; gap:0;
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:.7rem 1rem;
}
@media (max-width:560px){ .you-mini-card{ flex-direction:column; align-items:flex-start; flex-wrap:wrap } }
.you-mini-head{
  display:flex; align-items:center; gap:10px; flex:0 0 168px;
  background:var(--bg3); border:1px solid var(--border2); border-radius:10px;
  padding:.45rem .7rem .45rem .45rem; cursor:pointer; font-family:var(--font);
  transition:border-color .15s, color .15s;
}
@media (max-width:560px){ .you-mini-head{ flex:1 1 auto; width:100% } }
.you-mini-head:hover{ border-color:rgba(59,130,246,.45) }
.you-mini-avatar{
  width:32px; height:32px; border-radius:9px; flex-shrink:0;
  background:var(--blue-dim); border:1px solid rgba(59,130,246,.4); color:var(--blue);
  display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
}
.you-mini-headtext{ display:flex; flex-direction:column; gap:2px; text-align:left; min-width:0 }
.you-mini-name{ font-size:14.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.you-mini-hint{ font-size:10.5px; color:var(--text3); white-space:nowrap }
.you-mini-caret-wrap{
  width:22px; height:22px; border-radius:50%; flex-shrink:0;
  background:var(--bg2); border:1px solid var(--border2); color:var(--text2);
  display:flex; align-items:center; justify-content:center; font-size:9.5px;
  transition:transform .15s, background .15s, color .15s;
}
.you-mini-head:hover .you-mini-caret-wrap{ background:var(--blue-dim); color:var(--blue); border-color:rgba(59,130,246,.4) }
.you-mini-head.open .you-mini-caret-wrap{ transform:rotate(180deg) }
.you-mini-vdiv{ width:1px; height:32px; background:var(--border); margin:0 18px; flex-shrink:0 }
@media (max-width:560px){ .you-mini-vdiv{ display:none } }
.you-mini-stats{ display:flex; align-items:center; gap:22px; flex-wrap:nowrap }
@media (max-width:560px){
  .you-mini-stats{ display:none; flex-direction:column; align-items:flex-start; gap:10px; width:100%; margin-top:12px }
  .you-mini-card.expanded .you-mini-stats{ display:flex }
}
.you-mini-stat{
  display:flex; flex-direction:column; gap:3px; font-size:13px; flex:0 0 auto;
  text-decoration:none; color:inherit; padding:5px 7px; margin:-5px -7px; border-radius:8px;
  transition:background .15s;
}
.you-mini-stat:hover{ background:var(--bg3) }
.you-mini-stat.stat-se{ flex-basis:180px }
.you-mini-stat.stat-skill{ flex-basis:230px }
.you-mini-stat.stat-cert{ flex-basis:100px }
@media (max-width:560px){
  .you-mini-stat, .you-mini-stat.stat-se, .you-mini-stat.stat-skill, .you-mini-stat.stat-cert{ flex-basis:auto; width:100% }
}
.you-mini-stat-label{ display:flex; align-items:center; gap:4px; color:var(--text3); font-size:11.5px; white-space:nowrap }
.you-mini-stat-value-row{ display:flex; align-items:baseline; gap:7px; flex-wrap:wrap }
.you-mini-stat-value{ font-weight:700; color:var(--text) }
.you-mini-stat-value.warn{ color:var(--red) }
.you-mini-stat-sub{ font-size:11px; color:var(--text3); white-space:nowrap }
.you-mini-stat-sub.green{ color:var(--green) } .you-mini-stat-sub.red{ color:var(--red) }
.you-mini-stat .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0 }
.you-mini-stat .dot.green{ background:var(--green) } .you-mini-stat .dot.red{ background:var(--red) }
.you-mini-dropdown{
  display:none; position:absolute; top:100%; left:0; right:0; margin-top:6px; z-index:20;
  background:var(--bg2); border:1px solid var(--border2); border-radius:var(--radius); padding:11px;
  box-shadow:0 10px 28px rgba(0,0,0,.45);
}
.you-mini-dropdown.open{ display:block }
@media (max-width:560px){
  .you-mini-dropdown{ position:static; margin-top:10px; box-shadow:none; border-color:var(--border); padding:10px 0 0; border-top:1px solid var(--border); border-radius:0 }
}
.you-mini-dropdown-label{ font-size:10px; color:var(--text3); padding:1px 4px 7px }
.you-mini-chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px }
.you-mini-chip{ padding:5px 10px; border-radius:999px; border:.5px solid var(--border); cursor:pointer; font-size:11.5px; color:var(--text2); background:transparent; font-family:var(--font); transition:.15s }
.you-mini-chip:hover{ border-color:var(--border2); color:var(--text) }
.you-mini-chip.sel{ background:var(--blue-dim); color:var(--blue); border-color:rgba(59,130,246,.4) }
.you-mini-dropdown-foot{ font-size:10px; color:var(--text3); line-height:1.5; padding-top:7px; border-top:1px solid var(--border) }
.you-mini-reset{ font-size:10px; color:var(--text3); background:none; border:none; text-decoration:underline; cursor:pointer; font-family:var(--font); padding:0; margin-top:3px }
.you-mini-reset:hover{ color:var(--text2) }
</style>

<script>
const MONTHS = ['8月','9月','10月','11月','12月','1月','2月','3月','4月','5月','6月','7月'];

async function fetchCSV(path) {
  const { text } = await fetchCSVText(path);
  return Papa.parse(text, { header: true, skipEmptyLines: true, dynamicTyping: true }).data;
}

function calcTenure(joinStr) {
  const m = joinStr.match(/(\d+)年(\d+)月/);
  if (!m) return '';
  const joinY = parseInt(m[1]), joinM = parseInt(m[2]);
  const now = new Date(); const baseY = now.getFullYear(); const baseM = now.getMonth() + 1;
  let years = baseY - joinY; let months = baseM - joinM;
  if (months < 0) { years--; months += 12; }
  return years + '年' + months + 'ヶ月';
}

// スキルマップの評価時期。新しい時期が追加されたらskill.html内のPERIODSと合わせて追記すること
const YOU_SKILL_PERIODS = ['2026年8月','2026年11月','2027年2月','2027年5月'];

// 「あなたの状況」ウィジェットのセットアップ。skill.html・certifications.csvが未取得/空でも
// ダッシュボード本体には影響しないよう、この関数の中で完結させる
function setupYouWidget({ memberRows, seRows, calcTotal, skillText, certText }) {
  const youMembers = memberRows
    .filter(r => (r['ステータス']||'').trim() === '在籍')
    .map(r => (r['氏名']||'').trim())
    .filter(Boolean);
  if (!youMembers.length) return;

  // 得意スキル＝評価データが1件以上入っている時期のうち最新のものにおける、最もレベルの高いスキル（skill.htmlと同じ既定時期ロジック）
  const skillRows = skillText ? Papa.parse(skillText, { header: true, skipEmptyLines: true }).data : [];
  const periodsWithData = YOU_SKILL_PERIODS.filter(p => skillRows.some(r => (+r[p]||0) > 0));
  const skillPeriod = periodsWithData.length ? periodsWithData[periodsWithData.length - 1] : YOU_SKILL_PERIODS[0];
  const bestSkillByMember = {};
  skillRows.forEach(r => {
    const name = (r['氏名']||'').trim();
    const level = +r[skillPeriod] || 0;
    if (!name || level <= 0) return;
    const cur = bestSkillByMember[name];
    if (!cur || level > cur.level) bestSkillByMember[name] = { name: (r['スキル名']||'').trim(), level };
  });

  const certRows = certText ? Papa.parse(certText, { header: true, skipEmptyLines: true }).data : [];
  const certCountByMember = {};
  certRows.forEach(r => {
    const name = (r['氏名']||'').trim();
    if (!name) return;
    certCountByMember[name] = (certCountByMember[name] || 0) + 1;
  });

  const seByMember = {};
  seRows.forEach(r => {
    const name = (r['社員番号']||'').trim(); // 3se_report.csvのタイトル列。実体は氏名
    if (!name) return;
    seByMember[name] = { count: calcTotal(r), ok: r['達成状況'] === '達成' };
  });

  const STORE_KEY = 'you_widget_member';
  const head = document.getElementById('youMiniHead');
  const card = document.getElementById('youCard');
  const dropdown = document.getElementById('youDropdown');

  function renderYou(name) {
    document.getElementById('youAvatar').textContent = name.charAt(0);
    document.getElementById('youName').textContent = name;

    const se = seByMember[name];
    const skill = bestSkillByMember[name];
    const certs = certCountByMember[name] || 0;
    const q = encodeURIComponent(name);

    const seHTML = se
      ? `<span class="you-mini-stat-value ${se.ok ? '' : 'warn'}">${se.count}件</span><span class="you-mini-stat-sub ${se.ok ? 'green' : 'red'}">（${se.ok ? '達成' : '未達成'}）</span>`
      : `<span class="you-mini-stat-value">ー</span>`;
    const skillHTML = skill
      ? `<span class="you-mini-stat-value">${escapeHTML(skill.name)}</span><span class="you-mini-stat-sub">Lv.${skill.level}</span>`
      : `<span class="you-mini-stat-value">評価データなし</span>`;

    const seDot = se ? `<span class="dot ${se.ok ? 'green' : 'red'}"></span>` : '';
    document.getElementById('youStats').innerHTML = `
      <a class="you-mini-stat stat-se" href="reports.html" title="3SEレポートページへ">
        <span class="you-mini-stat-label">${seDot}3SEレポート提出件数</span>
        <span class="you-mini-stat-value-row">${seHTML}</span>
      </a>
      <a class="you-mini-stat stat-skill" href="skill.html?member=${q}&tab=radar" title="スキルマップ（本人のレーダー表示）へ">
        <span class="you-mini-stat-label">⭐ 得意スキル</span>
        <span class="you-mini-stat-value-row">${skillHTML}</span>
      </a>
      <a class="you-mini-stat stat-cert" href="skill.html?member=${q}#certifications" title="スキルマップ（保有資格一覧）へ">
        <span class="you-mini-stat-label">📜 保有資格</span>
        <span class="you-mini-stat-value-row"><span class="you-mini-stat-value">${certs}件</span></span>
      </a>
    `;
  }

  function selectMember(name, { persist } = { persist: true }) {
    if (!youMembers.includes(name)) return;
    document.querySelectorAll('.you-mini-chip').forEach(c => c.classList.toggle('sel', c.textContent === name));
    renderYou(name);
    if (persist) {
      localStorage.setItem(STORE_KEY, name);
      document.getElementById('youFootNote').textContent = `「${name}」として記憶しています。次回からこのブラウザで自動的に表示されます`;
      document.getElementById('youReset').style.display = 'inline-block';
    }
  }

  function buildChips() {
    const wrap = document.getElementById('youChips');
    wrap.innerHTML = '';
    youMembers.forEach(name => {
      const b = document.createElement('button');
      b.className = 'you-mini-chip';
      b.textContent = name;
      b.onclick = (e) => { e.stopPropagation(); selectMember(name); closeDropdownOnly(); };
      wrap.appendChild(b);
    });
  }

  // 「名前選択パネル（ドロップダウン）」の開閉と「指標の表示（モバイルのみ）」の開閉は別々の状態として持つ。
  // ヘッダーをタップした時は両方を一緒に開閉するが、名前を選んだ時はドロップダウンだけを閉じ、
  // モバイルで開いている指標はそのまま表示し続ける（見たいのは切替後の中身のため）
  function setDropdownOpen(open) {
    head.classList.toggle('open', open);
    dropdown.classList.toggle('open', open);
    head.setAttribute('aria-expanded', String(open));
  }
  function setStatsExpanded(open) { card.classList.toggle('expanded', open); }
  function closeDropdownOnly() { setDropdownOpen(false); }

  head.onclick = (e) => {
    e.stopPropagation();
    const opening = !dropdown.classList.contains('open');
    setDropdownOpen(opening);
    setStatsExpanded(opening);
  };
  document.addEventListener('click', (e) => {
    if (!document.getElementById('youMini').contains(e.target)) {
      setDropdownOpen(false);
      setStatsExpanded(false);
    }
  });
  document.getElementById('youReset').onclick = (e) => {
    e.stopPropagation();
    localStorage.removeItem(STORE_KEY);
    document.getElementById('youFootNote').textContent = '初回だけ選ぶと、次回から自動でこの人の状況が表示されます（このブラウザに記憶）';
    document.getElementById('youReset').style.display = 'none';
  };

  buildChips();
  const saved = localStorage.getItem(STORE_KEY);
  const initial = saved && youMembers.includes(saved) ? saved : youMembers[0];
  selectMember(initial, { persist: !!saved });
  document.getElementById('youMini').style.display = '';
}

async function init() {
  try {
    const [seRows, salesRows, memberRows, infoRows, skillR, certR] = await Promise.all([
      fetchCSV('data/3se_report.csv'),
      fetchCSV('data/sales.csv'),
      fetchCSV('data/members/member_master.csv'),
      fetchCSV('data/info.csv'),
      fetchCSVText('data/skill.csv'),
      fetchCSVText('data/certifications.csv'),
    ]);

    const active = seRows.filter(r => !String(r['備考']||'').match(/異動|退職/));
    const MONTH_KEYS = ['8月','9月','10月','11月','12月','1月','2月','3月','4月','5月','6月','7月'];
    const calcTotal = r => MONTH_KEYS.reduce((s,m)=>s+(+r[m]||0), 0);
    const seTotal   = seRows.reduce((s,r)=>s+calcTotal(r), 0);
    const seAchieved = active.filter(r=>r['達成状況']==='達成').length;
    const memberCount = memberRows.filter(r=>(r['ステータス']||'').trim()==='在籍').length;

    // ── 「あなたの状況」ウィジェット ──
    // skill.csv・certifications.csvは取得できなくてもダッシュボード本体の表示は継続する（skill.htmlと同じ方針）
    setupYouWidget({ memberRows, seRows, calcTotal, skillText: skillR.ok ? skillR.text : '', certText: certR.ok ? certR.text : '' });

    // 売上集計
    const today = new Date();
    function parseMonth(str) {
      if (!str) return null;
      const m1 = String(str).match(/(\d{4})[年](\d{1,2})[月]/);
      if (m1) return new Date(parseInt(m1[1]), parseInt(m1[2])-1, 1);
      const m2 = String(str).match(/(\d{4})[\/\-](\d{1,2})/);
      if (m2) return new Date(parseInt(m2[1]), parseInt(m2[2])-1, 1);
      return null;
    }
    function toNum(v) { return parseFloat(String(v||'0').replace(/,/g,''))||0; }

    const salesActual = salesRows.filter(r => toNum(r['実績']) > 0);
    const salesTotal  = salesActual.reduce((s,r)=>s+toNum(r['実績']), 0);
    const salesBudget = salesActual.reduce((s,r)=>s+toNum(r['予算']), 0);
    const salesRate   = salesBudget > 0 ? Math.round(salesTotal/salesBudget*100) : 0;

    document.getElementById('subtitle').textContent =
      `${today.toLocaleDateString('ja-JP')} 時点 — 在籍 ${memberCount}名`;

    // インフォメーション
    // 開始日・終了日は「2026/08/01」「2026年8月1日」「2026-08-01」いずれの表記でも比較できるようDate化する
    function parseDateFlexible(str) {
      if (!str) return null;
      const s = String(str).trim();
      let m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (m) return new Date(+m[1], +m[2]-1, +m[3]);
      m = s.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if (m) return new Date(+m[1], +m[2]-1, +m[3]);
      return null;
    }
    const INFO_TOP_LIMIT = 5;
    const NEW_BADGE_DAYS = 3; // 開始日から何日間「NEW!」を表示するか（開始日を含む）
    const infoCard = document.getElementById('infoCard');
    const infoList = document.getElementById('infoList');
    const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const activeInfo = infoRows
      .map(r => ({ r, start: parseDateFlexible(r['開始日']), end: parseDateFlexible(r['終了日']) }))
      .filter(x => x.start && x.end && today0 >= x.start && today0 <= x.end)
      .sort((a, b) => {
        const oa = a.r['表示順'] !== '' && a.r['表示順'] != null ? Number(a.r['表示順']) : null;
        const ob = b.r['表示順'] !== '' && b.r['表示順'] != null ? Number(b.r['表示順']) : null;
        if (oa != null && ob != null) return oa - ob;
        if (oa != null) return -1;
        if (ob != null) return 1;
        return a.end - b.end;
      });

    if (activeInfo.length > 0) {
      infoCard.style.display = '';
      infoList.innerHTML = activeInfo.slice(0, INFO_TOP_LIMIT).map(({ r, start, end }) => {
        const type = r['種別'] || 'info';
        const dotClass = type === 'deadline' ? 'info-deadline' : type === 'event' ? 'info-event' : 'info-info';
        const diff = Math.ceil((end - today0) / (1000*60*60*24));
        const dueClass = diff <= 7 ? 'info-due-urgent' : 'info-due-normal';
        const dueText = diff <= 7 ? `残${diff}日（〜${end.getFullYear()}/${end.getMonth()+1}/${end.getDate()}）` : `〜${end.getFullYear()}/${end.getMonth()+1}/${end.getDate()}`;
        const daysSinceStart = Math.floor((today0 - start) / (1000*60*60*24));
        const isNew = daysSinceStart >= 0 && daysSinceStart < NEW_BADGE_DAYS;
        return `<div class="info-item" onclick="this.classList.toggle('open')">
          <span class="info-dot ${dotClass}"></span>
          <div class="info-main">
            <div class="info-title-row">
              ${isNew ? '<span class="info-new-badge">NEW!</span>' : ''}
              <span class="info-title">${escapeHTML(r['タイトル'] || '')}</span>
              <span class="info-due-badge ${dueClass}">${dueText}</span>
              <span class="info-chevron">›</span>
            </div>
            <div class="info-body md-body">${md2html(r['本文'])}</div>
          </div>
        </div>`;
      }).join('');
      if (activeInfo.length > INFO_TOP_LIMIT) {
        infoList.innerHTML += `<a href="info.html" style="display:block;text-align:center;font-size:12px;color:var(--text3);padding:10px 0 2px">他 ${activeInfo.length - INFO_TOP_LIMIT}件 → インフォメーションですべて見る</a>`;
      }
    }

    // Metrics
    const mEl = document.getElementById('metrics');
    [
      { label:'ライン人数',        val: memberCount+'名',  sub:'在籍',           cls:'blue'   },
      { label:'3SEレポート累計',   val: seTotal+'件',      sub:`達成 ${seAchieved}名`, cls:'green'  },
      { label:'累計売上（実績月）', val: salesTotal.toLocaleString(), sub:`予算比 ${salesRate}%（単位：千円）`, cls:'amber'  },
      { label:'顧客数',            val: [...new Set(salesRows.map(r=>r['顧客名']))].length+'社', sub:'取引先', cls:'cyan' },
    ].forEach(m => {
      mEl.innerHTML += `<div class="metric ${m.cls}"><div class="metric-label">${m.label}</div><div class="metric-value">${m.val}</div><div class="metric-sub">${m.sub}</div></div>`;
    });

    // Summary cards
    const seMonthly = MONTHS.map(m => seRows.reduce((s,r)=>s+(+r[m]||0),0));
    document.getElementById('summaryCards').innerHTML = `
      <a href="member.html" class="summary-card">
        <div class="summary-card-icon">👥</div>
        <div class="summary-card-title">メンバー</div>
        <div class="summary-card-desc">第1ライン・第1-1ラインの構成とメンバー情報を確認できます。</div>
        <div class="summary-card-footer">
          <div><div class="summary-stat" style="color:var(--blue)">${memberCount}名</div><div class="summary-stat-label">在籍</div></div>
          <span style="color:var(--text3)">→</span>
        </div>
      </a>
      <a href="reports.html" class="summary-card">
        <div class="summary-card-icon">📋</div>
        <div class="summary-card-title">3SEレポート</div>
        <div class="summary-card-desc">メンバー別・月別・四半期別の提出件数と達成状況を確認できます。</div>
        <div class="summary-card-footer">
          <div><div class="summary-stat" style="color:var(--green)">${seTotal}件</div><div class="summary-stat-label">FY累計</div></div>
          <span style="color:var(--text3)">→</span>
        </div>
      </a>
      <a href="sales.html" class="summary-card">
        <div class="summary-card-icon">📈</div>
        <div class="summary-card-title">売上・数字</div>
        <div class="summary-card-desc">顧客別の予算vs実績を月次で確認できます。</div>
        <div class="summary-card-footer">
          <div><div class="summary-stat" style="color:var(--amber)">${salesTotal.toLocaleString()}</div><div class="summary-stat-label">累計実績（千円）</div></div>
          <span style="color:var(--text3)">→</span>
        </div>
      </a>
    `;

    // SE月別グラフ
    new Chart(document.getElementById('seChart'), {
      type: 'bar',
      data: { labels: MONTHS, datasets: [{ data: seMonthly, backgroundColor: 'rgba(59,130,246,0.6)', borderRadius: 3, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color:'#7f8fa8', font:{size:10} }, grid:{display:false} }, y: { ticks: { color:'#7f8fa8', font:{size:10} }, grid:{color:'rgba(255,255,255,0.04)'}, beginAtZero:true } } }
    });

    // 売上月別グラフ
    const salesByMonth = {};
    salesRows.forEach(r => {
      // 「2027年7月1日」のようなNotion同期形式はnew Date()で解釈できないため、parseMonth()を使う
      const d = parseMonth(r['月']); if(!d||isNaN(d)) return;
      const label = (d.getMonth()+1)+'月';
      if (!salesByMonth[label]) salesByMonth[label] = { budget: 0, actual: 0 };
      salesByMonth[label].budget += +r['予算']||0;
      salesByMonth[label].actual += +r['実績']||0;
    });
    const salesMonths = Object.keys(salesByMonth).filter(k => salesByMonth[k].actual > 0);
    new Chart(document.getElementById('salesChart'), {
      type: 'line',
      data: { labels: salesMonths, datasets: [
        { label:'実績', data: salesMonths.map(m=>salesByMonth[m].actual), borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,0.08)', borderWidth:2, tension:0.4, fill:true, pointRadius:3, pointBackgroundColor:'#f59e0b' },
        { label:'予算', data: salesMonths.map(m=>salesByMonth[m].budget), borderColor:'rgba(255,255,255,0.15)', borderDash:[4,3], borderWidth:1.5, fill:false, pointRadius:0 }
      ]},
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#7f8fa8', font:{size:10}, boxWidth:10 } } },
        scales:{ x:{ticks:{color:'#7f8fa8',font:{size:10}},grid:{display:false}}, y:{ticks:{color:'#7f8fa8',font:{size:10},callback:v=>v.toLocaleString()},grid:{color:'rgba(255,255,255,0.04)'},beginAtZero:false} } }
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('ready');
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:var(--red);font-size:13px">⚠ データの読み込みに失敗しました<br><small style="color:var(--text3);margin-top:8px;display:block">${e.message}</small></div>`;
  }
}
init();
</script>
</body>
</html>
